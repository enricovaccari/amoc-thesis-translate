<title>The Column — Static (C1)</title>

<!-- ============================================================================
PROVENANCE LEDGER (seed of thesis Table 7.2) — every visible element and its source
==============================================================================
CONDITION: C1 — static conventional (control group). Same information as the
experiential file, static idiom only: the added perceptual channels (motion,
sound, interactivity) are removed, the data is not (§7.2.2, Tversky 2019).
Active encoding: spatial position on both axes — the most accurate channel
(P0 Munzner/Bertin; P1 Cleveland–McGill), which is the point of the control.

SCREEN SEQUENCE (identical in both conditions): 1. landing screen (title +
language switch) → 2. shared intro with the anchor question (shared/intro-column.js)
→ 3. the condition's own representation. Only screen 3 differs.

VISIBLE ELEMENT                          → SOURCE
- Landing + intro screens                → shared/intro-column.js — imported verbatim by BOTH
                                           conditions (per language); no data content.
- Shared context blocks (3)              → shared/context-column.js — imported verbatim by BOTH
                                           conditions. NON-QUANTITATIVE FRAMING: data
                                           provenance (RAPID-MOCHA / Moat et al. 2026),
                                           one plain-language descriptive line, and the
                                           Sverdrup unit explained. They describe the
                                           OBJECT and the MECHANICS (how to read the
                                           axes), never the structure the study measures
                                           (no cells, no boundaries, no peak meaning).
- Ψ(z) curve                             → pca.mean_profile via reconstructProfile(mean,
                                           recon_basis.pc1, recon_basis.pc2, 0, 0) —
                                           the mean state through Eq. 7.1 itself, so the
                                           control and experimental conditions share one
                                           reconstruction path (shared/reconstruct.js).
- Depth axis (0 … 5995.1 m, ticks)       → pca.depth_m (0 at top, increasing downward —
                                           oceanographic convention).
- Transport axis (Sv, ticks, zero line)  → extent of the rendered profile; Ψ = overturning
                                           streamfunction in Sverdrup (bundle units).
- Peak marker + label "16.808 Sv @ 1030.70 m"
                                         → deriveAnchors(pca).peakSv / .peakDepth
                                           (computed from pca.mean_profile, never typed).
- (REMOVED) mode-shape insets + variance caption: PCA loadings and variance
  shares are MODEL OUTPUT, not empirical fact — the control condition shows
  the empirical profile only. The eof1/eof2 fields remain in the bundle and
  in shared/bundle.js; only the on-screen panels were removed.
- Light-blue plot background             → NON-INFORMATIONAL scaffolding: a very subtle
                                           water-column tint (palette north at ~5% alpha),
                                           identical intent in every condition.
- Colours, fonts, grid style             → shared/palette.js — NON-INFORMATIONAL
                                           scaffolding: semantic but non-quantitative,
                                           the conditions of legibility (Table 7.2).
- EN/IT language toggle                  → UI chrome only: re-labels text, never changes
                                           any number or encoding. Default language is
                                           configurable per link: ?lang=en / ?lang=it
                                           (URL param > stored choice > DEFAULT_LANG).
NOT SHOWN (defines C2/C3, not C1): particles/flow animation (P2), time controls,
sound (P5), hover/drag interactivity. A reader can decode Ψ at any depth; they
cannot see that water above and below ~1050 m flows in opposite directions —
that structural knowledge is exactly what the experimental condition adds and
what the study measures. The figure's difficulty IS the control condition.
============================================================================ -->

<style>
/* Palette custom properties are set at boot from shared/palette.js so the
   colours have a single source of truth (non-informational scaffolding). */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--abyss,#010811);color:var(--ink,#e7f0f7)}
/* Screens 2 and 3 share the landing screen's dark-blue radial gradient, so
   the transition between screens is seamless (same visual identity). */
body{font-family:var(--font-mono,monospace);cursor:none;
  background:radial-gradient(120% 120% at 50% 35%, #0a2136 0%, #061524 45%, #010811 100%) no-repeat fixed}
button{cursor:none}

/* Custom cursor — filled dot + soft-following ring, always visible on EVERY
   screen (same identity as the experiential file). */
#cursor-dot,#cursor-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:200;
  will-change:transform;opacity:1;transition:opacity .3s}
#cursor-dot{width:5px;height:5px;background:#fff}
#cursor-ring{width:30px;height:30px;border:1px solid rgba(255,255,255,.45);
  transition:transform .55s cubic-bezier(.16,.66,.3,1),opacity .3s}

/* === AUTHOR ATTRIBUTION === bottom-left, comfortable padding from both edges;
   identical placement across all three static scenes. */
#credit{position:fixed;bottom:22px;left:40px;z-index:55;pointer-events:none;
  font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink,#e7f0f7);opacity:.35}

header{position:absolute;top:34px;left:40px;z-index:10}
header h1{margin:0;font-family:var(--font-serif,serif);font-weight:400;font-size:28px;
  letter-spacing:12px;text-transform:uppercase}
.scene-label{font-size:10px;letter-spacing:5px;opacity:.5;margin-top:10px}
/* shared context: plain-language description + data provenance (non-quantitative) */
#describes{margin-top:16px;font-size:11px;line-height:1.75;color:var(--ink-soft,rgba(231,240,247,.55));
  max-width:380px;letter-spacing:.4px}
#source{margin-top:10px;font-size:8.5px;letter-spacing:1.2px;color:var(--ink-soft,rgba(231,240,247,.55));opacity:.8}

/* --- EN/IT toggle (UI chrome only — never changes data) --- */
#lang-toggle{position:fixed;top:36px;right:40px;z-index:60;display:flex;gap:6px}
#lang-toggle button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);
  color:var(--ink,#e7f0f7);padding:6px 12px;font-family:inherit;font-size:10px;
  letter-spacing:2px;cursor:pointer;transition:.2s}
#lang-toggle button:hover{background:rgba(255,255,255,.12)}
#lang-toggle button.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}

/* --- Screen 1: landing (same sequence and identity as the experiential file,
       including the animated bokeh layer) --- */
#splash{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;cursor:pointer;transition:opacity 1s;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 35%, #0a2136 0%, #061524 45%, #010811 100%)}
#bokeh{position:absolute;inset:0;z-index:-1;display:block}
#splash h2,#splash .splash-scene,#splash .splash-cta{position:relative;z-index:1}
#splash h2{margin:0;font-family:var(--font-serif,serif);font-weight:400;text-transform:uppercase;
  font-size:clamp(38px,6vw,72px);letter-spacing:.35em;text-indent:.35em}
#splash .splash-scene{margin-top:26px;font-size:14px;letter-spacing:8px;text-indent:8px;opacity:.6;text-transform:uppercase}
#splash .splash-cta{margin-top:70px;font-size:11px;letter-spacing:4px;text-indent:4px;color:var(--beacon,#ffb35c);
  text-transform:uppercase;animation:splash-blink 2.6s ease-in-out infinite}
@keyframes splash-blink{0%,100%{opacity:.25}50%{opacity:1}}

/* --- Screen 2: shared intro (identical in both conditions) --- */
#intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
/* same subtle floating bokeh as the landing screen, behind the intro panel */
#intro-bokeh{position:absolute;inset:0;z-index:0;display:block}
#intro .panel{position:relative;z-index:1;max-width:560px;padding:0 32px;text-align:center}
#intro h2{font-family:var(--font-serif,serif);font-weight:400;font-size:24px;
  letter-spacing:6px;text-transform:uppercase;line-height:1.5;margin:0 0 28px}
#intro p{font-size:13px;line-height:1.9;color:var(--ink-soft,rgba(231,240,247,.55));margin:0 0 18px}
#intro p.anchor-question{color:var(--ink,#e7f0f7);border:1px solid rgba(255,255,255,.14);
  padding:18px 22px;margin:30px 0;line-height:1.9}
#intro button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);
  color:var(--ink,#e7f0f7);padding:13px 30px;font-family:inherit;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s;margin-top:8px}
#intro button:hover{background:rgba(255,255,255,.12)}

/* --- Screen 3: the static figure (no interactivity) --- */
#figure{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#figure svg{max-width:min(1060px,96vw);max-height:92vh;width:100%;height:auto}

#load-error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:12px;color:var(--beacon,#ffb35c);text-align:center;line-height:2;display:none;z-index:50}
</style>

<body>

<header>
  <h1>Living Atlantic</h1>
  <div class="scene-label" id="scene-label"></div>
  <div id="describes"></div>
  <div id="source"></div>
</header>

<div id="lang-toggle">
  <button id="lang-en" type="button" class="active">EN</button>
  <button id="lang-it" type="button">IT</button>
</div>

<div id="splash">
  <canvas id="bokeh"></canvas>
  <h2>Living Atlantic</h2>
  <div class="splash-scene" id="splash-scene"></div>
  <div class="splash-cta" id="splash-cta"></div>
</div>

<div id="intro"><canvas id="intro-bokeh"></canvas><div class="panel" id="intro-panel"></div></div>
<div id="figure"></div>
<div id="load-error"></div>

<div id="cursor-ring"></div>
<div id="cursor-dot"></div>
<div id="credit">&copy; 2026 Enrico Vaccari &middot; MSc Thesis &middot; Tomorrow University</div>

<script type="module">
import { loadBundle, deriveAnchors } from '../../shared/bundle.js';
import { reconstructProfile } from '../../shared/reconstruct.js';
import { COL, INK, FONT } from '../../shared/palette.js';
import { introHTML } from '../../shared/intro-column.js';
import { CONTEXT, sourceHTML, describesHTML, helpContent, infoContent } from '../../shared/context-column.js';
import { mountSceneFrame } from '../../shared/scene-frame.js';

// On-figure "?" (how to read) + "i" (project/data) affordances — the SAME module
// and the SAME content as the experiential condition (shared/scene-frame.js), so
// framing stays symmetric. Sits under the language toggle; hidden until screen 3.
// (The driving question is asked once on the intro screen, not repeated here.)
const frame = mountSceneFrame({ pos: { top: '72px', right: '40px' }, hasInfo: true });

// Palette → CSS custom properties (single source of truth for scaffolding).
const rootStyle = document.documentElement.style;
rootStyle.setProperty('--abyss', COL.abyss);
rootStyle.setProperty('--beacon', COL.beacon);
rootStyle.setProperty('--ink', INK.ink);
rootStyle.setProperty('--ink-soft', INK.inkSoft);
rootStyle.setProperty('--font-mono', FONT.mono);
rootStyle.setProperty('--font-serif', FONT.serif);

/* ---------------------------------------------------------------- i18n ----
   Labels only. The toggle NEVER touches a number: every value still comes
   from the bundle through the same code path in both languages.
   Language resolution (so the survey can hand out the right link):
   URL ?lang=en|it  >  stored choice (localStorage)  >  DEFAULT_LANG. */
const DEFAULT_LANG = 'en';
const STR = {
  en: {
    doc_title:   'The Column — Static (C1)',
    scene_label: 'SCENE I — THE COLUMN &middot; STATIC',
    splash_scene:'Scene I — The Column',
    splash_cta:  'View the ocean profile',
    load_error:  'DATA BUNDLE NOT FOUND<br>expected at /data/amoc_translate_bundle.json — run <b>npm run dev</b>',
    axis_psi:    'OVERTURNING STREAMFUNCTION &#936; (Sv)',
    axis_depth:  'DEPTH (m)',
    peak_sub:    'PEAK OF THE MEAN PROFILE',
    header_line: 'MEAN VERTICAL OVERTURNING PROFILE &middot; ATLANTIC 26.5&deg;N &middot; {n} DEPTH LEVELS (0&ndash;{d} m)',
  },
  it: {
    doc_title:   'La Colonna — Statica (C1)',
    scene_label: 'SCENA I — LA COLONNA &middot; STATICA',
    splash_scene:'Scena I — La Colonna',
    splash_cta:  'Osserva il profilo dell&rsquo;oceano',
    load_error:  'BUNDLE DATI NON TROVATO<br>atteso in /data/amoc_translate_bundle.json — esegui <b>npm run dev</b>',
    axis_psi:    'FUNZIONE DI CORRENTE DI RIBALTAMENTO &#936; (Sv)',
    axis_depth:  'PROFONDIT&Agrave; (m)',
    peak_sub:    'PICCO DEL PROFILO MEDIO',
    header_line: 'PROFILO VERTICALE MEDIO DI RIBALTAMENTO &middot; ATLANTICO 26.5&deg;N &middot; {n} LIVELLI DI PROFONDIT&Agrave; (0&ndash;{d} m)',
  },
};
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang === 'en' || urlLang === 'it') ? urlLang
         : (localStorage.getItem('la-lang') === 'it' ? 'it' : DEFAULT_LANG);
function T(key, vars){
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

const esc = (s) => String(s);
const fmt = (v) => (Math.round(v * 100) / 100).toString();

function buildFigure(bundle){
  const pca = bundle.pca;
  const A = deriveAnchors(pca);
  const depth = pca.depth_m;
  const n = depth.length;

  // The mean state THROUGH Eq. 7.1 (pc1 = pc2 = 0) — same code path as C3.
  const prof = reconstructProfile(pca.mean_profile, pca.recon_basis.pc1, pca.recon_basis.pc2, 0, 0);

  // ---- geometry -----------------------------------------------------------
  // W shrunk from 1060 after the mode-shape insets were removed, so the main
  // panel re-centres in the viewport (the flexbox centres the whole SVG).
  const W = 820, H = 640;
  const M = { top: 74, bottom: 92, left: 96 };       // main panel margins
  const plotW = 560;
  const plotH = H - M.top - M.bottom;
  const dMax = depth[n - 1];

  let svMin = Infinity, svMax = -Infinity;
  for (const v of prof){ if (v < svMin) svMin = v; if (v > svMax) svMax = v; }
  const x0 = svMin - 0.8, x1 = svMax + 1.2;          // padded transport domain
  const X = (sv) => M.left + ((sv - x0) / (x1 - x0)) * plotW;
  const Y = (d) => M.top + (d / dMax) * plotH;       // 0 m at TOP, increasing downward

  const grid = 'rgba(231,240,247,0.10)';
  const axis = 'rgba(231,240,247,0.35)';

  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="Mean vertical overturning profile of the AMOC" font-family="${FONT.mono.replace(/"/g, '&quot;')}">`;

  // Very subtle water-column tint behind the main panel (palette north at ~5%
  // alpha): reinforces that the profile is the water column. Non-informational.
  s += `<rect x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}" fill="rgba(127,180,217,0.05)"/>`;

  // ---- publication-style grid + axes -------------------------------------
  const svTicks = [];
  for (let sv = Math.ceil(x0 / 5) * 5; sv <= x1; sv += 5) svTicks.push(sv);
  const dTicks = [];
  for (let d = 0; d <= dMax; d += 1000) dTicks.push(d);

  for (const d of dTicks){
    s += `<line x1="${M.left}" y1="${Y(d)}" x2="${M.left + plotW}" y2="${Y(d)}" stroke="${grid}" stroke-width="1"/>`;
    s += `<text x="${M.left - 12}" y="${Y(d) + 3.5}" fill="${INK.inkSoft}" font-size="10" text-anchor="end" letter-spacing="1">${d === 0 ? '0 m' : d}</text>`;
  }
  for (const sv of svTicks){
    s += `<line x1="${X(sv)}" y1="${M.top}" x2="${X(sv)}" y2="${M.top + plotH}" stroke="${grid}" stroke-width="1"/>`;
    s += `<text x="${X(sv)}" y="${M.top + plotH + 22}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="1">${sv === 0 ? '0 Sv' : (sv > 0 ? '+' + sv : sv)}</text>`;
  }
  // Ψ = 0 reference line (axis convention, slightly stronger than the grid)
  s += `<line x1="${X(0)}" y1="${M.top}" x2="${X(0)}" y2="${M.top + plotH}" stroke="${axis}" stroke-width="1" stroke-dasharray="2 4"/>`;
  // panel frame
  s += `<rect x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}" fill="none" stroke="${axis}" stroke-width="1"/>`;

  // axis titles + the shared Sverdrup context (from shared/context-column.js — the
  // unit made graspable; mechanics only, imported verbatim by both conditions)
  s += `<text x="${M.left + plotW / 2}" y="${M.top + plotH + 48}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="2">${T('axis_psi')}</text>`;
  // 16px leading between the caption lines (8.5px type): each line renders
  // separately below the axis title — nothing shares a slot.
  const svLines = (CONTEXT[lang] || CONTEXT.en).sverdrupLines;
  svLines.forEach((line, li) => {
    s += `<text x="${M.left + plotW / 2}" y="${M.top + plotH + 66 + li * 16}" fill="${INK.inkSoft}" font-size="8.5" text-anchor="middle" letter-spacing="1" opacity="0.85">${line}</text>`;
  });
  s += `<text x="${M.left - 64}" y="${M.top + plotH / 2}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="2" transform="rotate(-90 ${M.left - 64} ${M.top + plotH / 2})">${T('axis_depth')}</text>`;

  // ---- the mean Ψ(z) curve (single restrained colour: position is the only
  //      active channel in C1 — no regime colour-bands, no motion). A subtle
  //      semi-transparent fill between the curve and the Ψ = 0 axis helps the
  //      profile read as an area — same data, non-informational. -------------
  let path = '';
  for (let i = 0; i < n; i++) path += `${i ? 'L' : 'M'}${X(prof[i]).toFixed(2)},${Y(depth[i]).toFixed(2)}`;
  s += `<path d="${path}L${X(0).toFixed(2)},${Y(dMax).toFixed(2)}L${X(0).toFixed(2)},${Y(0).toFixed(2)}Z" fill="rgba(127,180,217,0.08)" stroke="none"/>`;
  s += `<path d="${path}" fill="none" stroke="${COL.north}" stroke-width="2.5" stroke-linejoin="round"/>`;

  // ---- peak marker — values from deriveAnchors, never typed ----------------
  const px = X(A.peakSv), py = Y(A.peakDepth);
  const peakLabel = `${A.peakSv.toFixed(3)} Sv @ ${A.peakDepth.toFixed(2)} m`;
  s += `<line x1="${M.left}" y1="${py}" x2="${px}" y2="${py}" stroke="${COL.beacon}" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>`;
  s += `<line x1="${px}" y1="${py}" x2="${px}" y2="${M.top + plotH}" stroke="${COL.beacon}" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>`;
  s += `<circle cx="${px}" cy="${py}" r="5" fill="none" stroke="${COL.beacon}" stroke-width="1.6"/>`;
  s += `<circle cx="${px}" cy="${py}" r="1.8" fill="${COL.beacon}"/>`;
  s += `<text x="${px + 14}" y="${py - 10}" fill="${COL.beacon}" font-size="11" letter-spacing="1">${esc(peakLabel)}</text>`;
  s += `<text x="${px + 14}" y="${py + 6}" fill="${INK.inkSoft}" font-size="9" letter-spacing="1">${T('peak_sub')}</text>`;

  // (Mode-shape insets and the variance caption were removed: the control
  //  condition displays the empirical profile only — no model output.)
  s += `<text x="${M.left}" y="${M.top - 22}" fill="${INK.inkSoft}" font-size="10" letter-spacing="2">${T('header_line', { n, d: fmt(dMax) })}</text>`;

  s += `</svg>`;
  document.getElementById('figure').innerHTML = s;
}

let bundleRef = null;

function applyLang(l){
  lang = l;
  localStorage.setItem('la-lang', l);
  document.documentElement.lang = l;
  document.title = T('doc_title').replace(/&mdash;/g, '—');
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-it').classList.toggle('active', l === 'it');
  document.getElementById('scene-label').innerHTML = T('scene_label');
  document.getElementById('splash-scene').innerHTML = T('splash_scene');
  document.getElementById('splash-cta').innerHTML = T('splash_cta');
  document.getElementById('load-error').innerHTML = T('load_error');
  // Shared context (shared/context-column.js) — imported verbatim by both conditions.
  document.getElementById('describes').innerHTML = describesHTML(l);
  document.getElementById('source').innerHTML = sourceHTML(l);
  // Screen 2 — imported verbatim; byte-identical to the experiential condition.
  document.getElementById('intro-panel').innerHTML = introHTML(l);
  // "?" help + "i" info — both from the shared modules, byte-identical to the
  // experiential condition.
  frame.render(l, { help: helpContent(l), info: infoContent(l) });
  if (bundleRef) buildFigure(bundleRef);             // re-label; numbers unchanged
}

// Custom cursor: the filled dot tracks instantly, the ring follows softly.
const curDot = document.getElementById('cursor-dot');
const curRing = document.getElementById('cursor-ring');
function moveCursor(x, y){
  curDot.style.transform  = `translate(${x - 2.5}px,${y - 2.5}px)`;
  curRing.style.transform = `translate(${x - 15}px,${y - 15}px)`;
}
moveCursor(innerWidth / 2, innerHeight / 2);       // parked at centre until the first mousemove
window.addEventListener('mousemove', (e) => moveCursor(e.clientX, e.clientY));

// Landing bokeh — the same animated identity as the experiential file's
// landing screen: soft, blurred, drifting light spots. Purely decorative
// (non-informational); it stops the moment the splash is dismissed.
// Shown on BOTH the landing screen and the intro screen (screen 2): one set of
// spots advanced each frame, painted onto whichever canvas is currently visible.
const bokehCanvases = ['bokeh', 'intro-bokeh']
  .map(id => document.getElementById(id)).filter(Boolean)
  .map(cv => ({ cv, g: cv.getContext('2d') }));
let bokehSpots = [], bokehOn = true, bokehW = 0, bokehH = 0;
function resizeBokeh(){
  const dpr = window.devicePixelRatio || 1;
  bokehW = innerWidth; bokehH = innerHeight;
  for (const { cv, g } of bokehCanvases){
    cv.width = Math.round(bokehW*dpr); cv.height = Math.round(bokehH*dpr);
    cv.style.width = bokehW + 'px'; cv.style.height = bokehH + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (!bokehSpots.length) seedBokeh();
}
function seedBokeh(){
  bokehSpots = [];
  for (let i = 0; i < 26; i++) bokehSpots.push({
    x: Math.random()*bokehW, y: Math.random()*bokehH,
    r: 24 + Math.random()*100,
    vx: (Math.random()-0.5)*0.25, vy: -0.05 - Math.random()*0.22,
    a: 0.05 + Math.random()*0.13,
    hue: Math.random() < 0.55 ? '127,180,217' : '255,179,92'   // ocean blue / warm beacon
  });
}
function drawBokeh(){
  if (!bokehOn) return;
  for (const sp of bokehSpots){                         // advance the spots once
    sp.x += sp.vx; sp.y += sp.vy;
    if (sp.y + sp.r < 0)      sp.y = bokehH + sp.r;
    if (sp.x < -sp.r)         sp.x = bokehW + sp.r;
    if (sp.x > bokehW + sp.r) sp.x = -sp.r;
  }
  for (const { cv, g } of bokehCanvases){                // paint every VISIBLE canvas
    if (cv.offsetParent === null) continue;              // skip hidden screens
    g.clearRect(0, 0, bokehW, bokehH);
    g.globalCompositeOperation = 'lighter';
    for (const sp of bokehSpots){
      const grd = g.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sp.r);
      grd.addColorStop(0, 'rgba(' + sp.hue + ',' + sp.a + ')');
      grd.addColorStop(1, 'rgba(' + sp.hue + ',0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(drawBokeh);
}
window.addEventListener('resize', resizeBokeh);
resizeBokeh();
drawBokeh();

// Screen sequence: landing → shared intro → the static figure.
document.getElementById('splash').addEventListener('click', () => {
  const sp = document.getElementById('splash');
  sp.style.opacity = '0';
  sp.style.pointerEvents = 'none';
  setTimeout(() => { sp.style.display = 'none'; }, 1000);  // hide splash; bokeh keeps drifting on the intro screen
  document.getElementById('intro').style.display = 'flex';
}, { once: true });

// Delegated so the intro button survives language re-renders.
document.getElementById('intro-panel').addEventListener('click', (e) => {
  if (e.target.id !== 'intro-continue') return;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('figure').style.display = 'flex';
  bokehOn = false;                                   // stop the bokeh once the figure is shown
  frame.show(true);                                  // the question stays for the whole scene
});
document.getElementById('lang-en').addEventListener('click', () => applyLang('en'));
document.getElementById('lang-it').addEventListener('click', () => applyLang('it'));

async function boot(){
  applyLang(lang);
  try {
    bundleRef = await loadBundle(['../../data/amoc_translate_bundle.json', '/data/amoc_translate_bundle.json']);
  } catch (e) {
    document.getElementById('load-error').style.display = 'block';
    console.error(e);
    return;
  }
  buildFigure(bundleRef);
}
boot();
</script>
