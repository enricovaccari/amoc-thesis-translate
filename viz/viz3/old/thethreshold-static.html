<title>The Threshold — Static (C1)</title>

<!-- ============================================================================
PROVENANCE LEDGER (seed of thesis Table 7.2) — every visible element and its source
==============================================================================
CONDITION: C1 — static conventional (control group), SCENE III. The canonical
idiom exactly as a reanalysis paper publishes it: three member time series of
the same quantity on one panel, with a faint envelope band. Same bundle, same
data, same axis ranges as the experiential file; the added perceptual channels
(motion, animated variability, sound, interactivity) are removed, the data is
not (§7.2.2, Tversky 2019).

SCREEN SEQUENCE (identical in both conditions): 1. landing screen (title +
language switch) → 2. shared intro with the anchor question
(shared/intro-threshold.js) → 3. the condition's own representation. Only
screen 3 differs.

VISIBLE ELEMENT                          → SOURCE
- Landing + intro screens                → shared/intro-threshold.js — imported verbatim by
                                           BOTH conditions (per language); no data content.
                                           The anchor question (certainty over time) is
                                           answered by NEITHER file — that is the quantity
                                           measured.
- Shared context blocks                  → shared/context-threshold.js — imported verbatim
                                           by BOTH conditions. NON-QUANTITATIVE FRAMING:
                                           data provenance (Copernicus GREP ensemble,
                                           DOI 10.48670/moi-00024), one plain-language
                                           descriptive line, and the reading floor (three
                                           models, one quantity; close = agree, spread =
                                           disagree; the Sverdrup). They teach the
                                           INSTRUMENT, never the reading (no statement of
                                           WHEN the lines agree or disagree).
- The three member lines                 → copernicus_ensemble.members.cglo/.glor/.oras,
                                           one value per month, 372 months. Colours are
                                           three tints of the existing palette blues
                                           (deep → north → northHi ramp positions), NOT
                                           new signal colours; no red/green.
- Faint background band                  → copernicus_ensemble.lower/.upper (the min/max
                                           envelope across the 3 members, per
                                           band_definition), ~7% opacity — texture behind
                                           the lines, unlabelled, never quantified on
                                           screen.
- Legend (C-GLORS / GLORYS / ORAS5)      → names the instrument (which line is which
                                           model), never the reading. Model names from
                                           the bundle's source field family.
- Axis ticks, ranges, grid, zero-free    → extent of the three member arrays; y axis in
  frame                                    Sv (bundle units), x axis in years from
                                           copernicus_ensemble.time. Same publication
                                           style as the Scene I/II static plots.
- Title / caption lines                  → time endpoints from copernicus_ensemble.time
                                           ({y0}/{y1} filled at runtime, never typed).
- Colours, fonts, grid style             → shared/palette.js — NON-INFORMATIONAL
                                           scaffolding: semantic but non-quantitative,
                                           the conditions of legibility (Table 7.2).
- EN/IT language toggle                  → UI chrome only: re-labels text, never changes
                                           any number or encoding. ?lang=en / ?lang=it.
NOT SHOWN (defines C2/C3, not C1): playback of time, the strands braiding and
splaying in motion, the agitation of the medium scaling with the band width,
hover values, sound. A reader can decode all three values at any month; they
cannot FEEL the disagreement as a changing quality — that perceptual
availability is exactly what the experimental condition adds and what the
study measures. The figure's difficulty IS the control condition. STATIC: no
animation, no hover, no interaction, no annotation of any era — 2004 is not
marked, no era is shaded or labelled, no region is named wide or narrow.
============================================================================ -->

<style>
/* Palette custom properties are set at boot from shared/palette.js so the
   colours have a single source of truth (non-informational scaffolding). */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--abyss,#010811);color:var(--ink,#e7f0f7)}
/* Screens 2 and 3 share the landing screen's dark-blue radial gradient, so
   the transition between screens is seamless (same visual identity). */
body{font-family:var(--font-mono,monospace);cursor:none;
  background:radial-gradient(120% 120% at 50% 35%, #0a2136 0%, #061524 45%, #010811 100%) no-repeat fixed}
button{cursor:none}

/* Custom cursor — filled dot + soft-following ring, always visible on EVERY
   screen (same identity as the experiential file). */
#cursor-dot,#cursor-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:200;
  will-change:transform;opacity:1;transition:opacity .3s}
#cursor-dot{width:5px;height:5px;background:#fff}
#cursor-ring{width:30px;height:30px;border:1px solid rgba(255,255,255,.45);
  transition:transform .55s cubic-bezier(.16,.66,.3,1),opacity .3s}

/* Ownership credit — visible on every screen; centred, lifted off the
   bottom edge, clear of every other UI element */
#credit{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:55;pointer-events:none;
  font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink,#e7f0f7);opacity:.4}

header{position:absolute;top:34px;left:40px;z-index:10}
header h1{margin:0;font-family:var(--font-serif,serif);font-weight:400;font-size:28px;
  letter-spacing:12px;text-transform:uppercase}
.scene-label{font-size:10px;letter-spacing:5px;opacity:.5;margin-top:10px}
/* shared context: plain-language description + data provenance — ONE visual
   group, centred over the composition; the language switch top edge aligns
   with this block. */
#context-center{position:fixed;top:34px;left:50%;transform:translateX(-50%);
  width:min(560px,72vw);text-align:center;z-index:10;pointer-events:none}
#describes{font-size:11px;line-height:1.75;color:var(--ink-soft,rgba(231,240,247,.55));letter-spacing:.4px}
#source{margin-top:8px;font-size:8.5px;letter-spacing:1.2px;color:var(--ink-soft,rgba(231,240,247,.55));opacity:.8}

/* --- EN/IT toggle (UI chrome only — never changes data) --- */
#lang-toggle{position:fixed;top:36px;right:40px;z-index:60;display:flex;gap:6px}
#lang-toggle button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);
  color:var(--ink,#e7f0f7);padding:6px 12px;font-family:inherit;font-size:10px;
  letter-spacing:2px;cursor:none;transition:.2s}
#lang-toggle button:hover{background:rgba(255,255,255,.12)}
#lang-toggle button.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}

/* (No interactive controls in the static condition — language switch only.) */

/* --- Screen 1: landing (same sequence and identity as the experiential file,
       including the animated bokeh layer) --- */
#splash{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;cursor:none;transition:opacity 1s;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 35%, #0a2136 0%, #061524 45%, #010811 100%)}
#bokeh{position:absolute;inset:0;z-index:-1;display:block}
#splash h2,#splash .splash-scene,#splash .splash-cta{position:relative;z-index:1}
#splash h2{margin:0;font-family:var(--font-serif,serif);font-weight:400;text-transform:uppercase;
  font-size:clamp(38px,6vw,72px);letter-spacing:.35em;text-indent:.35em}
#splash .splash-scene{margin-top:26px;font-size:14px;letter-spacing:8px;text-indent:8px;opacity:.6;text-transform:uppercase}
#splash .splash-cta{margin-top:70px;font-size:11px;letter-spacing:4px;text-indent:4px;color:var(--beacon,#ffb35c);
  text-transform:uppercase;animation:splash-blink 2.6s ease-in-out infinite}
@keyframes splash-blink{0%,100%{opacity:.25}50%{opacity:1}}

/* --- Screen 2: shared intro (identical in both conditions) --- */
#intro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
#intro .panel{max-width:560px;padding:0 32px;text-align:center}
#intro h2{font-family:var(--font-serif,serif);font-weight:400;font-size:24px;
  letter-spacing:6px;text-transform:uppercase;line-height:1.5;margin:0 0 28px}
#intro p{font-size:13px;line-height:1.9;color:var(--ink-soft,rgba(231,240,247,.55));margin:0 0 18px}
#intro p.anchor-question{color:var(--ink,#e7f0f7);border:1px solid rgba(255,255,255,.14);
  padding:18px 22px;margin:30px 0;line-height:1.9}
#intro button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);
  color:var(--ink,#e7f0f7);padding:13px 30px;font-family:inherit;font-size:11px;
  letter-spacing:3px;text-transform:uppercase;cursor:none;transition:.3s;margin-top:8px}
#intro button:hover{background:rgba(255,255,255,.12)}

/* --- Screen 3: the static figure (no interactivity). The time series is
       WIDE — allow the SVG the full comfortable width. --- */
#figure{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#figure svg{max-width:min(1150px,96vw);max-height:88vh;width:100%;height:auto}

#load-error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:12px;color:var(--beacon,#ffb35c);text-align:center;line-height:2;display:none;z-index:50}
</style>

<body>

<header>
  <h1>Living Atlantic</h1>
  <div class="scene-label" id="scene-label"></div>
</header>

<div id="context-center">
  <div id="describes"></div>
  <div id="source"></div>
</div>

<div id="lang-toggle">
  <button id="lang-en" type="button" class="active">EN</button>
  <button id="lang-it" type="button">IT</button>
</div>
<!-- No interactive controls in the static condition (language switch only). -->

<div id="splash">
  <canvas id="bokeh"></canvas>
  <h2>Living Atlantic</h2>
  <div class="splash-scene" id="splash-scene"></div>
  <div class="splash-cta" id="splash-cta"></div>
</div>

<div id="intro"><div class="panel" id="intro-panel"></div></div>
<div id="figure"></div>
<div id="load-error"></div>

<div id="cursor-ring"></div>
<div id="cursor-dot"></div>
<div id="credit">&copy; 2026 Enrico Vaccari &middot; MSc Thesis &middot; Tomorrow University</div>

<script type="module">
import { loadBundle } from '../../shared/bundle.js';
import { COL, INK, FONT } from '../../shared/palette.js';
import { introHTML } from '../../shared/intro-threshold.js';
import { sourceHTML, describesHTML, readingLines } from '../../shared/context-threshold.js';

// Palette → CSS custom properties (single source of truth for scaffolding).
const rootStyle = document.documentElement.style;
rootStyle.setProperty('--abyss', COL.abyss);
rootStyle.setProperty('--beacon', COL.beacon);
rootStyle.setProperty('--excursion', COL.excursion);
rootStyle.setProperty('--ink', INK.ink);
rootStyle.setProperty('--ink-soft', INK.inkSoft);
rootStyle.setProperty('--font-mono', FONT.mono);
rootStyle.setProperty('--font-serif', FONT.serif);

/* ---------------------------------------------------------------- i18n ----
   Labels only. The toggle NEVER touches a number: every value still comes
   from the bundle through the same code path in both languages. Language
   resolution: URL ?lang=en|it > stored choice (localStorage) > DEFAULT_LANG. */
const DEFAULT_LANG = 'en';
const STR = {
  en: {
    doc_title:   'The Threshold — Static (C1)',
    scene_label: 'SCENE III &mdash; THE THRESHOLD &middot; STATIC',
    splash_scene:'Scene III — The Threshold',
    splash_cta:  'View the three estimates',
    load_error:  'DATA BUNDLE NOT FOUND<br>expected at /data/amoc_translate_bundle.json — run <b>npm run dev</b>',
    axis_x:      'YEAR',
    axis_y:      '&Psi; &middot; TRANSPORT (SV)',
    header_line: 'AMOC TRANSPORT &middot; THREE REANALYSES &middot; {y0}&ndash;{y1}',
    caption_line:'EACH LINE IS ONE MODEL&rsquo;S ESTIMATE OF THE SAME QUANTITY &middot; WHERE THEY MEET, THEY AGREE',
    leg_title:   'Reanalysis models',
    months: ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
             'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'],
  },
  it: {
    doc_title:   'La Soglia — Statica (C1)',
    scene_label: 'SCENA III &mdash; LA SOGLIA &middot; STATICA',
    splash_scene:'Scena III — La Soglia',
    splash_cta:  'Osserva le tre stime',
    load_error:  'BUNDLE DATI NON TROVATO<br>atteso in /data/amoc_translate_bundle.json — esegui <b>npm run dev</b>',
    axis_x:      'ANNO',
    axis_y:      '&Psi; &middot; TRASPORTO (SV)',
    header_line: 'TRASPORTO AMOC &middot; TRE RIANALISI &middot; {y0}&ndash;{y1}',
    caption_line:'OGNI LINEA &Egrave; LA STIMA DI UN MODELLO DELLA STESSA QUANTIT&Agrave; &middot; DOVE SI INCONTRANO, CONCORDANO',
    leg_title:   'Modelli di rianalisi',
    months: ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO',
             'LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'],
  },
};
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang === 'en' || urlLang === 'it') ? urlLang
         : (localStorage.getItem('la-lang') === 'it' ? 'it' : DEFAULT_LANG);
function T(key, vars){
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

/* ------------------------------------------- the three member tints --------
   Three tints of the existing palette blues, taken as positions on the SAME
   perceptually ordered ramp every scene uses (deep → north → northHi from
   shared/palette.js). Not new signal colours; no red/green. The IDENTICAL
   three constants drive the strands in the experiential file — one visual
   vocabulary, two idioms. Assignment is fixed and neutral: cglo / glor /
   oras in bundle member order. */
const hexRgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RAMP = [hexRgb(COL.deep), hexRgb(COL.north), hexRgb(COL.northHi)];
function rampColor(t){                            // t ∈ [0,1] on the shared blue ramp
  const seg = t <= 0.5 ? [RAMP[0], RAMP[1], t * 2] : [RAMP[1], RAMP[2], (t - 0.5) * 2];
  const c = seg[0].map((v, i) => Math.round(v + (seg[1][i] - v) * seg[2]));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const MEMBERS = [
  { key: 'cglo', name: 'C-GLORS', color: rampColor(0.55) },
  { key: 'glor', name: 'GLORYS',  color: rampColor(0.20) },
  { key: 'oras', name: 'ORAS5',   color: rampColor(1.00) },
];

function buildFigure(bundle){
  const ENS = bundle.copernicus_ensemble;
  const N = ENS.time.length;
  const y0lab = ENS.time[0].slice(0, 4), y1lab = ENS.time[N - 1].slice(0, 4);

  // ---- axis ranges: extent of the three member arrays, padded 5% ---------
  let vMin = Infinity, vMax = -Infinity;
  for (const m of MEMBERS){
    const a = ENS.members[m.key];
    for (let i = 0; i < N; i++){
      if (a[i] < vMin) vMin = a[i];
      if (a[i] > vMax) vMax = a[i];
    }
  }
  const pad = (vMax - vMin) * 0.05;
  const yLo = vMin - pad, yHi = vMax + pad;

  // ---- geometry: wide publication panel + legend column to the right -----
  const plotW = 780, plotH = 390;
  const M = { top: 76, left: 96 };
  const legGap = 30, legW = 140;
  const W = M.left + plotW + legGap + legW + 30;
  const H = M.top + plotH + 168;

  const X = (i) => M.left + (i / (N - 1)) * plotW;
  const Y = (v) => M.top + ((yHi - v) / (yHi - yLo)) * plotH;

  const grid = 'rgba(231,240,247,0.10)';
  const axis = 'rgba(231,240,247,0.35)';

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="AMOC transport, three reanalyses, monthly time series" font-family="${FONT.mono.replace(/"/g, '&quot;')}">`;

  // Very subtle water tint behind the panel (palette north at ~5% alpha):
  // identical intent in every condition. Non-informational.
  svg += `<rect x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}" fill="rgba(127,180,217,0.05)"/>`;

  // ---- publication-style grid + axes (Scene I styling) -------------------
  const yTicks = [];
  for (let v = Math.ceil(yLo / 5) * 5; v <= yHi; v += 5) yTicks.push(v);
  for (const v of yTicks){
    svg += `<line x1="${M.left}" y1="${Y(v)}" x2="${M.left + plotW}" y2="${Y(v)}" stroke="${grid}" stroke-width="1"/>`;
    svg += `<text x="${M.left - 12}" y="${Y(v) + 3.5}" fill="${INK.inkSoft}" font-size="10" text-anchor="end" letter-spacing="1">${v}</text>`;
  }
  // x ticks: years divisible by 5, at their January, from the time array
  for (let yr = Math.ceil(+y0lab / 5) * 5; yr <= +y1lab; yr += 5){
    const idx = ENS.time.indexOf(yr + '-01');
    if (idx < 0) continue;
    svg += `<line x1="${X(idx)}" y1="${M.top}" x2="${X(idx)}" y2="${M.top + plotH}" stroke="${grid}" stroke-width="1"/>`;
    svg += `<text x="${X(idx)}" y="${M.top + plotH + 22}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="1">${yr}</text>`;
  }
  // panel frame
  svg += `<rect x="${M.left}" y="${M.top}" width="${plotW}" height="${plotH}" fill="none" stroke="${axis}" stroke-width="1"/>`;

  // axis titles
  svg += `<text x="${M.left + plotW / 2}" y="${M.top + plotH + 48}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="2">${T('axis_x')}</text>`;
  svg += `<text x="${M.left - 60}" y="${M.top + plotH / 2}" fill="${INK.inkSoft}" font-size="10" text-anchor="middle" letter-spacing="2" transform="rotate(-90 ${M.left - 60} ${M.top + plotH / 2})">${T('axis_y')}</text>`;

  // ---- the faint envelope band (lower–upper across the 3 members), behind
  //      the lines — texture, unlabelled, never quantified on screen -------
  let band = '';
  for (let i = 0; i < N; i++) band += `${X(i).toFixed(1)},${Y(ENS.upper[i]).toFixed(1)} `;
  for (let i = N - 1; i >= 0; i--) band += `${X(i).toFixed(1)},${Y(ENS.lower[i]).toFixed(1)} `;
  svg += `<polygon points="${band}" fill="rgba(127,180,217,0.07)"/>`;

  // ---- the three member lines: one model's estimate each, month by month -
  for (const m of MEMBERS){
    const a = ENS.members[m.key];
    let pts = '';
    for (let i = 0; i < N; i++) pts += `${X(i).toFixed(1)},${Y(a[i]).toFixed(1)} `;
    svg += `<polyline points="${pts}" fill="none" stroke="${m.color}" stroke-width="1.3" stroke-opacity="0.92" stroke-linejoin="round"/>`;
  }

  // ---- legend (right of the panel): names the instrument — which line is
  //      which model — never the reading. Sentence casing for the title. ---
  const lgX = M.left + plotW + legGap, lgY0 = M.top + 8;
  svg += `<text x="${lgX}" y="${lgY0}" fill="${INK.inkSoft}" font-size="9" letter-spacing="1">${T('leg_title')}</text>`;
  MEMBERS.forEach((m, k) => {
    const ly = lgY0 + 22 + k * 22;
    svg += `<line x1="${lgX}" y1="${ly - 3}" x2="${lgX + 26}" y2="${ly - 3}" stroke="${m.color}" stroke-width="1.6"/>`;
    svg += `<text x="${lgX + 34}" y="${ly}" fill="${INK.inkSoft}" font-size="9.5" letter-spacing="1">${m.name}</text>`;
  });

  // title line, same position and style as Scenes I–II
  svg += `<text x="${M.left}" y="${M.top - 22}" fill="${INK.inkSoft}" font-size="10" letter-spacing="2">${T('header_line', { y0: y0lab, y1: y1lab })}</text>`;

  // caption, Scene-I style, then the shared reading floor
  // (shared/context-threshold.js — teaches the instrument; imported verbatim
  // by both conditions)
  svg += `<text x="${M.left + plotW / 2}" y="${M.top + plotH + 74}" fill="${INK.inkSoft}" font-size="9" text-anchor="middle" letter-spacing="1.5">${T('caption_line')}</text>`;
  readingLines(lang, { y0: y0lab, y1: y1lab }).forEach((line, li) => {
    svg += `<text x="${M.left + plotW / 2}" y="${M.top + plotH + 96 + li * 16}" fill="${INK.inkSoft}" font-size="8.5" text-anchor="middle" letter-spacing="1" opacity="0.85">${line}</text>`;
  });

  svg += `</svg>`;
  document.getElementById('figure').innerHTML = svg;
}

let bundleRef = null;

function applyLang(l){
  lang = l;
  localStorage.setItem('la-lang', l);
  document.documentElement.lang = l;
  document.title = T('doc_title').replace(/&mdash;/g, '—');
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-it').classList.toggle('active', l === 'it');
  document.getElementById('scene-label').innerHTML = T('scene_label');
  document.getElementById('splash-scene').innerHTML = T('splash_scene');
  document.getElementById('splash-cta').innerHTML = T('splash_cta');
  document.getElementById('load-error').innerHTML = T('load_error');
  // Shared context (shared/context-threshold.js) — imported verbatim by both
  // conditions; {n}/{y0}/{y1} are filled from the bundle, never typed.
  document.getElementById('source').innerHTML = sourceHTML(l);
  if (bundleRef){
    const ENS = bundleRef.copernicus_ensemble;
    document.getElementById('describes').innerHTML = describesHTML(l, {
      n: ENS.time.length,
      y0: ENS.time[0].slice(0, 4),
      y1: ENS.time[ENS.time.length - 1].slice(0, 4),
    });
  }
  // Screen 2 — imported verbatim; byte-identical to the experiential condition.
  document.getElementById('intro-panel').innerHTML = introHTML(l);
  if (bundleRef) buildFigure(bundleRef);             // re-label; numbers unchanged
}
// (No interactive controls in the static condition: the only switch is the
//  language toggle. The static figure suggests no interaction.)

// Custom cursor: the filled dot tracks instantly, the ring follows softly.
const curDot = document.getElementById('cursor-dot');
const curRing = document.getElementById('cursor-ring');
function moveCursor(x, y){
  curDot.style.transform  = `translate(${x - 2.5}px,${y - 2.5}px)`;
  curRing.style.transform = `translate(${x - 15}px,${y - 15}px)`;
}
moveCursor(innerWidth / 2, innerHeight / 2);       // parked at centre until the first mousemove
window.addEventListener('mousemove', (e) => moveCursor(e.clientX, e.clientY));

// Landing bokeh — the same animated identity as the experiential file's
// landing screen: soft, blurred, drifting light spots. Purely decorative
// (non-informational); it stops the moment the splash is dismissed.
const bokehCv = document.getElementById('bokeh');
const bg = bokehCv.getContext('2d');
let bokehSpots = [], bokehOn = true, bokehW = 0, bokehH = 0;
function resizeBokeh(){
  const dpr = window.devicePixelRatio || 1;
  bokehW = innerWidth; bokehH = innerHeight;
  bokehCv.width = Math.round(bokehW*dpr); bokehCv.height = Math.round(bokehH*dpr);
  bokehCv.style.width = bokehW + 'px'; bokehCv.style.height = bokehH + 'px';
  bg.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!bokehSpots.length) seedBokeh();
}
function seedBokeh(){
  bokehSpots = [];
  for (let i = 0; i < 26; i++) bokehSpots.push({
    x: Math.random()*bokehW, y: Math.random()*bokehH,
    r: 24 + Math.random()*100,
    vx: (Math.random()-0.5)*0.25, vy: -0.05 - Math.random()*0.22,
    a: 0.05 + Math.random()*0.13,
    hue: Math.random() < 0.55 ? '127,180,217' : '255,179,92'   // ocean blue / warm beacon
  });
}
function drawBokeh(){
  if (!bokehOn) return;
  bg.clearRect(0, 0, bokehW, bokehH);
  bg.globalCompositeOperation = 'lighter';
  for (const sp of bokehSpots){
    sp.x += sp.vx; sp.y += sp.vy;
    if (sp.y + sp.r < 0)      sp.y = bokehH + sp.r;
    if (sp.x < -sp.r)         sp.x = bokehW + sp.r;
    if (sp.x > bokehW + sp.r) sp.x = -sp.r;
    const grd = bg.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sp.r);
    grd.addColorStop(0, 'rgba(' + sp.hue + ',' + sp.a + ')');
    grd.addColorStop(1, 'rgba(' + sp.hue + ',0)');
    bg.fillStyle = grd;
    bg.beginPath(); bg.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); bg.fill();
  }
  bg.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawBokeh);
}
window.addEventListener('resize', resizeBokeh);
resizeBokeh();
drawBokeh();

// Screen sequence: landing → shared intro → the static figure.
document.getElementById('splash').addEventListener('click', () => {
  const sp = document.getElementById('splash');
  sp.style.opacity = '0';
  sp.style.pointerEvents = 'none';
  setTimeout(() => { sp.style.display = 'none'; bokehOn = false; }, 1000);  // stop the intro layer
  document.getElementById('intro').style.display = 'flex';
}, { once: true });

// Delegated so the intro button survives language re-renders.
document.getElementById('intro-panel').addEventListener('click', (e) => {
  if (e.target.id !== 'intro-continue') return;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('figure').style.display = 'flex';
});
document.getElementById('lang-en').addEventListener('click', () => applyLang('en'));
document.getElementById('lang-it').addEventListener('click', () => applyLang('it'));

async function boot(){
  applyLang(lang);
  try {
    bundleRef = await loadBundle('/data/amoc_translate_bundle.json');
  } catch (e) {
    document.getElementById('load-error').style.display = 'block';
    console.error(e);
    return;
  }
  applyLang(lang);                                   // context lines need bundle vars
}
boot();
</script>
