<!-- ==========================================================================
© 2026 Enrico Vaccari — All rights reserved.
MSc thesis research artefact ("Living Atlantic"), Tomorrow University (ToU).
============================================================================

PROVENANCE LEDGER (thesis Table 7.2) — CONDITION: C2+C3 combined, what the
EXPERIMENTAL group sees. SCENE III — the three reanalyses LIVED rather than
displayed. Same 372 months, same three member series, same axis ranges and
member tints as thethreshold-static.html (control).

DISCLOSURE RULE (this scene): teach the viewer to read the instrument, never
tell them the reading. Nothing on screen states WHEN the three lines agree or
disagree, that the spread shrinks over time, that observations caused
convergence, or that any period is more or less certain. Whatever structure a
viewer notices, they notice bottom-up — in the width, motion and warmth of the
living band, and in the sound.

ELEMENT → SOURCE · PRINCIPLE
- The three strands       → copernicus_ensemble.members.cglo/.glor/.oras walked
                            in order, 1993-01 → 2023-12 · P1/P2. Position is the
                            true monthly value. Each strand keeps a distinct
                            weight/opacity so the viewer perceives THREE voices.
                            NEVER reduced to mean ± error bar.
- THE LIVING BAND         → the region actually spanned by the three displayed
  (Item 1, the core)        lines. Its vertical extent IS the real envelope
                            (copernicus_ensemble.lower/.upper, which the bundle
                            defines as min/max across the three members), so it
                            literally narrows and widens with the data. Three
                            redundant channels, ONE measured quantity — the real
                            band width (upper − lower) per month, min–max
                            normalised over the record (P4, DP2.2):
                              · MOTION — the band's edges and its internal
                                filaments churn with amplitude ∝ width; tight
                                → near-still, wide → restless.
                              · WIDTH  — the true envelope geometry itself.
                              · TEMPERATURE — cool palette blue when narrow,
                                warming toward amber (#ffb35c) when wide.
                                Deliberately NOT green→red: green/red read as
                                right/wrong and would disclose the reading.
                                Amber means "warm/active", never "bad".
                            All agitation is bounded by, and anchored to, the
                            envelope — there are no free-floating particles with
                            no data referent. Never printed as a number.
- Aggregation lens        → RAW / SMOOTHED (3·12·24-month rolling mean applied
  (Item 2)                   identically to all three members) / ENVELOPE (band
                            only). These are VIEWS of identical data: they change
                            representation, never information. No "spread" or
                            "disagreement" view exists — plotting band width as
                            its own curve would draw the answer.
- Model isolate toggles   → dim one strand so any pair, or one alone, can be
                            watched. Labelled by MODEL NAME only.
- Ghost trails (Item 5)   → the visited path persists behind the current moment,
                            fading with age — recent bright, older dim but
                            present. Memory of the path; no era is labelled.
- Current-moment marker   → filled amber (palette beacon), the same amber
                            vocabulary as Scenes I–II.
- Month + three values    → the current/held month and its three model values
                            ("MARCH 2010 · 17.2 · 14.8 · 19.1 Sv"). No mean, no
                            spread, no gap figure, no "disagreement" label.
- Sound (Item 4)          → same synthesis family as Scenes I–II · P5. Clean when
                            the models agree, roughening/detuning as the band
                            widens — driven by the real band width. OFF BY
                            DEFAULT; never named beyond SOUND ON/OFF.
- Replay/Speed/Reset      → ½×/1×/2×/3×, return to 1993, restore defaults. Speed
                            is uniform across time — playback NEVER auto-slows at
                            any period (that would flag it).
- Shared context          → shared/context-threshold.js + shared/intro-threshold.js,
                            imported byte-identically by BOTH conditions (the
                            anchor question is answered by NEITHER file).
- Colours/fonts/bokeh     → shared/palette.js · non-informational scaffolding.
                            Member tints are positions on the shared blue ramp
                            (deep → north → northHi). No red/green/traffic colours.
NOT SHOWN (would break the study): a mean line, error bars, a printed band width
or ±number, a band-width/"spread" curve, any marker at 2004, any "observations
begin" caption, any era shading or label, any auto-slow zone. ITEM 6 (a
measured→reconstructed solidity cue) is deliberately NOT implemented: the
purely-reconstructed reach coincides with the wide-band reach, so the two cues
would fuse into a "past = uncertain" reading. Omitted in every condition.
=========================================================================== -->

<script type="module">
/* === DATA-DRIVEN LOGIC ===
   Every on-screen value traces to amoc_translate_bundle.json:
   - Position: copernicus_ensemble.members.cglo/.glor/.oras (true monthly values).
   - The living band: its geometry is the region spanned by the three displayed
     lines — in RAW that is exactly copernicus_ensemble.lower/.upper, which the
     bundle defines as min/max across the three members.
   - Motion, warmth and sound: the REAL band width (upper − lower) per month,
     min–max normalised over the record. Never invented, never printed. */
import { loadBundle } from '../../shared/bundle.js';
import { COL, INK, FONT } from '../../shared/palette.js';
import { introHTML, anchorQuestionHTML } from '../../shared/intro-threshold.js';
import { sourceHTML, describesHTML, readingLines, helpContent } from '../../shared/context-threshold.js';
import { mountSceneFrame } from '../../shared/scene-frame.js';

// Persistent driving question + "?" help panel — the SAME module, the SAME two
// strings as the static condition (shared/scene-frame.js). Hidden until screen
// 3; the question is already on view inside the intro panel before that.
// (Named sceneFrame — `frame` is already this file's animation-frame counter.)
const sceneFrame = mountSceneFrame();

const STR = {
en: {
  doc_title:   'The Threshold — Experiential (C2+C3)',
  splash_scene:'Scene III — The Threshold',
  splash_click:'Click anywhere to start exploring',
  scene_label: 'SCENE III &mdash; THE THRESHOLD &middot; EXPERIENTIAL',
  hover_hint:  'HOVER ANY MOMENT TO READ THE THREE ESTIMATES &middot; DRAG THE SLIDER TO WALK TIME &middot; PAUSE ANYWHERE TO HOLD A MOMENT',
  month_label: 'CURRENT MONTH',
  speed:       'SPEED',
  view:        'VIEW',
  window:      'WINDOW',
  models:      'MODELS',
  lens_raw:    'RAW',
  lens_smooth: 'SMOOTHED',
  lens_env:    'ENVELOPE',
  pause:       '&#10074;&#10074; PAUSE &amp; SCRUB',
  resume:      '&#9654; RESUME AUTO',
  sound_off:   '&#9834; SOUND: OFF',
  sound_on:    '&#9834; SOUND: ON',
  replay:      '&#8635; REPLAY',
  reset:       'RESET',
  unit:        'Sv',
  load_error:  'BUNDLE NOT FOUND<br>run <b>npm run dev</b><br>(data expected at /data/amoc_translate_bundle.json)',
  months: ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
           'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'],
},
it: {
  doc_title:   'La Soglia — Esperienziale (C2+C3)',
  splash_scene:'Scena III — La Soglia',
  splash_click:'Clicca ovunque per iniziare a esplorare',
  scene_label: 'SCENA III &mdash; LA SOGLIA &middot; ESPERIENZIALE',
  hover_hint:  'PASSA IL CURSORE SU UN MOMENTO PER LE TRE STIME &middot; TRASCINA IL CURSORE PER PERCORRERE IL TEMPO &middot; METTI IN PAUSA PER FERMARE UN MOMENTO',
  month_label: 'MESE CORRENTE',
  speed:       'VELOCIT&Agrave;',
  view:        'VISTA',
  window:      'FINESTRA',
  models:      'MODELLI',
  lens_raw:    'GREZZA',
  lens_smooth: 'LISCIATA',
  lens_env:    'INVILUPPO',
  pause:       '&#10074;&#10074; PAUSA &amp; SCORRI',
  resume:      '&#9654; RIPRENDI AUTO',
  sound_off:   '&#9834; AUDIO: OFF',
  sound_on:    '&#9834; AUDIO: ON',
  replay:      '&#8635; RIPETI',
  reset:       'REIMPOSTA',
  unit:        'Sv',
  load_error:  'BUNDLE NON TROVATO<br>esegui <b>npm run dev</b><br>(dati attesi in /data/amoc_translate_bundle.json)',
  months: ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO',
           'LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'],
},
};
const DEFAULT_LANG = 'en';
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang === 'en' || urlLang === 'it') ? urlLang
         : (localStorage.getItem('la-lang') === 'it' ? 'it' : DEFAULT_LANG);
function T(key, vars){
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function fmtMonth(ym){
  const [y, m] = ym.split('-');
  return T('months')[+m - 1] + ' ' + y;
}

/* --------------------------------------- member tints + band temperature ---
   Tints are positions on the shared blue ramp (deep → north → northHi),
   IDENTICAL to the control file. Distinct weights = three voices. */
const hexRgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RAMP = [hexRgb(COL.deep), hexRgb(COL.north), hexRgb(COL.northHi)];
function rampColor(t){
  const seg = t <= 0.5 ? [RAMP[0], RAMP[1], t * 2] : [RAMP[1], RAMP[2], (t - 0.5) * 2];
  const c = seg[0].map((v, i) => Math.round(v + (seg[1][i] - v) * seg[2]));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const MEMBERS = [
  { key: 'cglo', name: 'C-GLORS', color: rampColor(0.55), phase: 0.0, width: 1.5, alpha: 0.90 },
  { key: 'glor', name: 'GLORYS',  color: rampColor(0.20), phase: 2.1, width: 1.15, alpha: 0.82 },
  { key: 'oras', name: 'ORAS5',   color: rampColor(1.00), phase: 4.2, width: 1.35, alpha: 0.95 },
];
/* Band temperature: cool palette blue (narrow) → amber beacon (wide).
   Deliberately NOT green→red — those read as right/wrong. Amber = warm/active. */
const COOL = hexRgb(COL.north), WARM = hexRgb(COL.beacon);
function tempColor(w, a){
  const c = COOL.map((v, i) => Math.round(v + (WARM[i] - v) * w));
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

/* ============================== state ==================================== */
let ENS = null, N = 0, dataLoaded = false;
let RAW = null;                                    // {cglo,glor,oras} raw arrays
let SMOOTH = null;                                 // {3:{...},12:{...},24:{...}}
let LO = null, HI = null;                          // real envelope (bundle)
let wNorm = null;                                  // real band width, normalised (the ONE driver)
let yLo = 0, yHi = 1;
let W = 0, H = 0;
let tFloat = 0;
let playing = true;
let speedMul = 1;
let frame = 0;
let beatEnv = 0, nextBeatT = 0;
let lens = 'raw';                                  // 'raw' | 'smoothed' | 'envelope'
let smoothWin = 12;
const memShown = { cglo: true, glor: true, oras: true };

const cv = document.getElementById('scene');
const g  = cv.getContext('2d');
const mouse = { x: -100, y: -100 };
const timeEl = document.getElementById('time');
const hoverEl = document.getElementById('hover');
const valuesEl = document.getElementById('values-line');

let fit = null;
function computeFit(){
  if (!ENS) return;
  const mL = 90, mR = 90, mT = 165, mB = 315;
  fit = { ox: mL, oy: mT, pw: Math.max(320, W - mL - mR), ph: Math.max(180, H - mT - mB) };
}
const X = (t) => fit.ox + (t / (N - 1)) * fit.pw;
const Y = (v) => fit.oy + ((yHi - v) / (yHi - yLo)) * fit.ph;

/* Centred rolling mean, edge-clamped — applied IDENTICALLY to all three
   members. A re-view of the same data: no value is created or removed. */
function rollingMean(arr, win){
  const out = new Float64Array(arr.length);
  const h = Math.floor(win / 2);
  for (let i = 0; i < arr.length; i++){
    let s = 0, n = 0;
    for (let k = i - h; k <= i + h; k++){
      const j = Math.max(0, Math.min(arr.length - 1, k));
      s += arr[j]; n++;
    }
    out[i] = s / n;
  }
  return out;
}
/* The series currently DISPLAYED for a member (raw or smoothed). */
const activeSeries = (key) => (lens === 'smoothed') ? SMOOTH[smoothWin][key] : RAW[key];
/* Band edges = the region actually spanned by the three displayed lines.
   In RAW/ENVELOPE this equals the bundle's lower/upper exactly (the bundle
   defines them as min/max across the three members). */
function bandAt(t){
  let lo = Infinity, hi = -Infinity;
  for (const m of MEMBERS){
    const v = valAt(activeSeries(m.key), t);
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }
  return [lo, hi];
}
function valAt(arr, t){
  const i0 = Math.floor(t), i1 = Math.min(i0 + 1, N - 1), f = t - i0;
  const e = f * f * (3 - 2 * f);
  return arr[i0] + (arr[i1] - arr[i0]) * e;
}
/* THE ONE DRIVER: the real band width (upper − lower) per month, normalised.
   Held constant across lens modes so re-viewing never alters the encoding. */
function agitAt(t){
  const i0 = Math.floor(t), i1 = Math.min(i0 + 1, N - 1), f = t - i0;
  return wNorm[i0] * (1 - f) + wNorm[i1] * f;
}

/* ------------------------------------------------------------ rendering --- */
function draw(){
  if (!dataLoaded) return;
  frame++;
  g.clearRect(0, 0, W, H);
  const bgr = g.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, Math.max(W, H)*0.75);
  bgr.addColorStop(0, '#0a2136'); bgr.addColorStop(0.45, '#061524'); bgr.addColorStop(1, '#010811');
  g.fillStyle = bgr; g.fillRect(0, 0, W, H);

  // Playback clock — uniform speed across time (never auto-slows anywhere)
  if (playing){
    tFloat += 0.06 * speedMul;
    if (tFloat > N - 1) tFloat = 0;
    timeEl.value = Math.round(tFloat);
  }
  const visited = Math.floor(tFloat);
  const agitNow = agitAt(tFloat);

  drawFurniture();

  // ===================== ITEM 1 — THE LIVING BAND ========================
  // Per-segment quads between the lower and upper edge of the region spanned
  // by the three displayed lines. WIDTH is the true envelope geometry;
  // TEMPERATURE and MOTION both ride on the real normalised band width.
  // All agitation is bounded by the envelope — no free-floating particles.
  const STEP = Math.max(1, Math.round(N / (fit.pw / 2.5)));
  if (visited > 0){
    for (let i = 0; i < visited; i += STEP){
      const j = Math.min(i + STEP, visited);
      const wA = wNorm[i], wB = wNorm[j];
      const [loA, hiA] = bandAt(i), [loB, hiB] = bandAt(j);
      // edge turbulence: amplitude ∝ real band width at that month
      const eA = wA * 3.2 * Math.sin(i * 0.55 + frame * (0.045 + wA * 0.09));
      const eB = wB * 3.2 * Math.sin(j * 0.55 + frame * (0.045 + wB * 0.09));
      const fA = wA * 3.2 * Math.cos(i * 0.47 + frame * (0.040 + wA * 0.08));
      const fB = wB * 3.2 * Math.cos(j * 0.47 + frame * (0.040 + wB * 0.08));
      const wq = (wA + wB) / 2;
      g.fillStyle = tempColor(wq, 0.10 + 0.20 * wq);
      g.beginPath();
      g.moveTo(X(i), Y(hiA) + eA);
      g.lineTo(X(j), Y(hiB) + eB);
      g.lineTo(X(j), Y(loB) + fB);
      g.lineTo(X(i), Y(loA) + fA);
      g.closePath();
      g.fill();
    }
    // internal churning filaments — bounded by the band, so the motion always
    // reads as "the medium between the three models", never as loose dots
    for (let s = 0; s < 3; s++){
      g.beginPath();
      let started = false;
      for (let i = 0; i <= visited; i += STEP){
        const wq = wNorm[i];
        const [lo, hi] = bandAt(i);
        const mid = (lo + hi) / 2, half = (hi - lo) / 2;
        // vertical position inside the band, drifting with the churn
        const u = Math.sin(i * (0.21 + s * 0.07) + frame * (0.05 + wq * 0.12) + s * 2.1);
        const yv = Y(mid + u * half * (0.30 + 0.60 * wq));
        if (!started){ g.moveTo(X(i), yv); started = true; } else g.lineTo(X(i), yv);
      }
      const wMid = wNorm[Math.max(0, Math.floor(visited / 2))];
      g.strokeStyle = tempColor(wMid, 0.06 + 0.16 * wMid);
      g.lineWidth = 1;
      g.stroke();
    }
  }

  // ================ ITEM 5 — GHOST TRAILS (the three strands) =============
  // The visited path persists behind the current moment, fading with age:
  // recent bright, older dim but present. Memory of the path; no era labelled.
  if (lens !== 'envelope'){
    for (const m of MEMBERS){
      const arr = activeSeries(m.key);
      const dim = memShown[m.key] ? 1 : 0.14;
      g.lineWidth = m.width;
      g.lineJoin = 'round';
      for (let i = 0; i < visited; i += STEP){
        const j = Math.min(i + STEP, visited);
        const age = 1 - (i / Math.max(1, visited));        // 0 = at head, 1 = oldest
        const ghost = 0.22 + 0.78 * Math.pow(1 - age, 1.6); // fade with age
        g.strokeStyle = m.color;
        g.globalAlpha = m.alpha * dim * ghost;
        g.beginPath();
        g.moveTo(X(i), Y(arr[i]));
        g.lineTo(X(j), Y(arr[j]));
        g.stroke();
      }
      // interpolated head — the strand reaches exactly the current moment
      g.globalAlpha = m.alpha * dim;
      g.beginPath();
      g.moveTo(X(visited), Y(arr[visited]));
      g.lineTo(X(tFloat), Y(valAt(arr, tFloat)));
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  // ============= THE CURRENT MOMENT — amber vocabulary of I–II ============
  const xNow = X(tFloat);
  const [loNow, hiNow] = bandAt(tFloat);
  g.strokeStyle = COL.beacon;
  g.globalAlpha = 0.22; g.lineWidth = 1;
  g.beginPath(); g.moveTo(xNow, fit.oy); g.lineTo(xNow, fit.oy + fit.ph); g.stroke();
  g.globalAlpha = 0.5 + beatEnv * 0.3; g.lineWidth = 2;
  g.beginPath(); g.moveTo(xNow, Y(hiNow) - 6); g.lineTo(xNow, Y(loNow) + 6); g.stroke();
  g.globalAlpha = 1;
  if (lens !== 'envelope'){
    for (const m of MEMBERS){
      const dim = memShown[m.key] ? 1 : 0.14;
      const hy = Y(valAt(activeSeries(m.key), tFloat));
      const glow = g.createRadialGradient(xNow, hy, 0, xNow, hy, 9 + beatEnv * 5);
      glow.addColorStop(0, m.color.replace('rgb', 'rgba').replace(')', `,${0.55 * dim})`));
      glow.addColorStop(1, m.color.replace('rgb', 'rgba').replace(')', ',0)'));
      g.fillStyle = glow;
      g.beginPath(); g.arc(xNow, hy, 9 + beatEnv * 5, 0, Math.PI * 2); g.fill();
      g.globalAlpha = dim; g.fillStyle = m.color;
      g.beginPath(); g.arc(xNow, hy, 3.2, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    }
  }
  document.getElementById('beat-dot').style.transform = 'scale(' + (1 + beatEnv * 0.6).toFixed(2) + ')';

  updateReadout();
  updateHeartbeat();
  updateHover();
  requestAnimationFrame(draw);
}

function drawFurniture(){
  g.font = '9px ui-monospace,monospace';
  g.strokeStyle = 'rgba(231,240,247,0.08)';
  g.fillStyle = 'rgba(231,240,247,0.35)';
  g.lineWidth = 1;
  for (let v = Math.ceil(yLo / 5) * 5; v <= yHi; v += 5){
    const y = Y(v);
    g.beginPath(); g.moveTo(fit.ox, y); g.lineTo(fit.ox + fit.pw, y); g.stroke();
    g.textAlign = 'right';
    g.fillText(String(v), fit.ox - 10, y + 3);
  }
  const yrA = +ENS.time[0].slice(0, 4), yrB = +ENS.time[N - 1].slice(0, 4);
  g.textAlign = 'center';
  for (let yr = Math.ceil(yrA / 5) * 5; yr <= yrB; yr += 5){
    const idx = ENS.time.indexOf(yr + '-01');
    if (idx < 0) continue;
    const x = X(idx);
    g.beginPath(); g.moveTo(x, fit.oy); g.lineTo(x, fit.oy + fit.ph); g.stroke();
    g.fillText(String(yr), x, fit.oy + fit.ph + 20);
  }
  g.save();
  g.translate(fit.ox - 44, fit.oy + fit.ph / 2);
  g.rotate(-Math.PI / 2);
  g.fillText('Ψ · TRANSPORT (SV)', 0, 0);
  g.restore();
  g.textAlign = 'left';
}

/* ---------------------------------------- month + three-value readout ------
   The held/hovered month (or current playback month) and its three model
   values, each in its strand tint. No mean, no spread, no gap figure. */
let readoutIdx = -1, readoutLens = null;
function updateReadout(){
  const hi = hoverIdx();
  const idx = hi >= 0 ? hi : Math.round(tFloat);
  const sig = lens + smoothWin;
  if (idx === readoutIdx && sig === readoutLens) return;
  readoutIdx = idx; readoutLens = sig;
  document.getElementById('month-big').textContent = fmtMonth(ENS.time[idx]);
  valuesEl.innerHTML = MEMBERS.map((m, k) =>
    `<span style="color:${m.color}">${activeSeries(m.key)[idx].toFixed(1)}</span>` +
    (k < 2 ? '<span class="vsep">·</span>' : '')
  ).join('') + `<span class="vunit">${T('unit')}</span>`;
}

function hoverIdx(){
  if (!dataLoaded || document.body.classList.contains('pre-start')) return -1;
  const inX = mouse.x >= fit.ox && mouse.x <= fit.ox + fit.pw;
  const inY = mouse.y >= fit.oy - 20 && mouse.y <= fit.oy + fit.ph + 20;
  if (!inX || !inY) return -1;
  const ti = Math.round(((mouse.x - fit.ox) / fit.pw) * (N - 1));
  if (ti < 0 || ti > Math.floor(tFloat)) return -1;
  return ti;
}
function updateHover(){
  const ti = hoverIdx();
  if (ti < 0){ hoverEl.style.display = 'none'; return; }
  const vals = MEMBERS.map(m => activeSeries(m.key)[ti].toFixed(1)).join(' · ');
  hoverEl.textContent = fmtMonth(ENS.time[ti]) + ' · ' + vals + ' Sv';
  hoverEl.style.display = 'block';
  hoverEl.style.left = Math.min(W - 320, mouse.x + 18) + 'px';
  hoverEl.style.top  = Math.max(12, mouse.y - 34) + 'px';
}

/* ------------------------------------------------------------- audio -------
   P5 — OFF BY DEFAULT. Same synthesis family as Scenes I–II. The ONE mapped
   variable is the real normalised band width: clean tone when the models
   agree, roughening/detuning as the band widens. Never numeric. */
let AC = null, osc = null, pulse = null, master = null;
let oceanGain = null, oceanLp = null, drone2 = null;
let audioOn = false;

function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.62;
  master.connect(AC.destination);
  osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 60;
  const osc2 = AC.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 120;
  const partial = AC.createGain(); partial.gain.value = 0.35;
  pulse = AC.createGain(); pulse.gain.value = 0;
  osc.connect(pulse); osc2.connect(partial); partial.connect(pulse); pulse.connect(master);
  osc.start(); osc2.start();
  const len = AC.sampleRate * 4;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = last * 3.5;
  }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  oceanLp = AC.createBiquadFilter(); oceanLp.type = 'lowpass'; oceanLp.frequency.value = 380; oceanLp.Q.value = 0.7;
  oceanGain = AC.createGain(); oceanGain.gain.value = 0.06;
  src.connect(oceanLp); oceanLp.connect(oceanGain); oceanGain.connect(master);
  const swell = AC.createOscillator(); swell.frequency.value = 0.06;
  const swellAmt = AC.createGain(); swellAmt.gain.value = 0.035;
  swell.connect(swellAmt); swellAmt.connect(oceanGain.gain);
  const drone1 = AC.createOscillator(); drone1.type = 'sine';     drone1.frequency.value = 82;
  drone2 = AC.createOscillator(); drone2.type = 'triangle'; drone2.frequency.value = 82.4;
  const droneGain = AC.createGain(); droneGain.gain.value = 0.014;
  drone1.connect(droneGain); drone2.connect(droneGain); droneGain.connect(master);
  src.start(); swell.start(); drone1.start(); drone2.start();
}
function updateHeartbeat(){
  beatEnv *= 0.93;
  const norm = agitAt(tFloat);
  const bpm = 40 + norm * 40;
  const nowS = performance.now() / 1000;
  if (nowS < nextBeatT) return;
  nextBeatT = nowS + 60 / bpm;
  beatEnv = 1;
  if (audioOn && AC && AC.state === 'running'){
    const now = AC.currentTime;
    pulse.gain.cancelScheduledValues(now);
    pulse.gain.setTargetAtTime(0.4 + norm * 0.9, now, 0.015);
    pulse.gain.setTargetAtTime(0, now + 0.09, 0.12);
    osc.frequency.setTargetAtTime(55 + norm * 20, now, 0.05);
    if (oceanGain){
      oceanGain.gain.setTargetAtTime(0.05 + 0.11 * norm, now, 0.08);
      oceanLp.frequency.setTargetAtTime(320 + norm * 900, now, 0.10);
    }
    if (drone2) drone2.frequency.setTargetAtTime(82.4 + norm * 5.6, now, 0.10);
  }
}
function refreshSoundBtn(){
  const b = document.getElementById('sound-toggle');
  b.innerHTML = audioOn ? T('sound_on') : T('sound_off');
  b.classList.toggle('on', audioOn);
}
function setSound(on){
  audioOn = on;
  refreshSoundBtn();
  if (on){ initAudio(); if (AC.state === 'suspended') AC.resume(); }
  else if (AC && AC.state === 'running') AC.suspend();
}
document.getElementById('sound-toggle').onclick = () => setSound(!audioOn);

/* ------------------------------------------------------------- wiring ----- */
function setPlaying(p){
  playing = p;
  document.getElementById('play-toggle').innerHTML = p ? T('pause') : T('resume');
}
document.getElementById('play-toggle').onclick = () => setPlaying(!playing);
timeEl.addEventListener('input', () => { setPlaying(false); tFloat = +timeEl.value; });
document.getElementById('speed-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  speedMul = +b.dataset.speed;
  document.querySelectorAll('#speed-seg button').forEach(x => x.classList.toggle('active', x === b));
});
// Aggregation lens — VIEWS of identical data: representation changes, the
// information does not. No "spread"/"disagreement" view exists.
function setLens(l){
  lens = l;
  document.querySelectorAll('#lens-seg button').forEach(x => x.classList.toggle('active', x.dataset.lens === l));
  document.getElementById('win-group').style.display = (l === 'smoothed') ? 'flex' : 'none';
  readoutLens = null;
}
document.getElementById('lens-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setLens(b.dataset.lens);
});
document.getElementById('win-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  smoothWin = +b.dataset.win;
  document.querySelectorAll('#win-seg button').forEach(x => x.classList.toggle('active', x === b));
  readoutLens = null;
});
document.getElementById('model-seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  memShown[b.dataset.key] = !memShown[b.dataset.key];
  b.classList.toggle('off', !memShown[b.dataset.key]);
});
document.getElementById('replay-toggle').onclick = () => { tFloat = 0; timeEl.value = 0; setPlaying(true); };
document.getElementById('reset-toggle').onclick = () => {
  tFloat = 0; timeEl.value = 0; speedMul = 1; smoothWin = 12;
  for (const k in memShown) memShown[k] = true;
  document.querySelectorAll('#model-seg button').forEach(x => x.classList.remove('off'));
  document.querySelectorAll('#speed-seg button').forEach(x => x.classList.toggle('active', x.dataset.speed === '1'));
  document.querySelectorAll('#win-seg button').forEach(x => x.classList.toggle('active', x.dataset.win === '12'));
  setLens('raw');
  setSound(false);
  setPlaying(true);
};

const curDot = document.getElementById('cursor-dot');
const curRing = document.getElementById('cursor-ring');
function moveCursor(x, y){
  curDot.style.transform  = `translate(${x - 2.5}px,${y - 2.5}px)`;
  curRing.style.transform = `translate(${x - 15}px,${y - 15}px)`;
}
moveCursor(innerWidth / 2, innerHeight / 2);
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  moveCursor(e.clientX, e.clientY);
});

const bokehCv = document.getElementById('bokeh');
const bg = bokehCv.getContext('2d');
let bokehSpots = [], bokehOn = true, bokehW = 0, bokehH = 0;
function resizeBokeh(){
  const dpr = window.devicePixelRatio || 1;
  bokehW = innerWidth; bokehH = innerHeight;
  bokehCv.width = Math.round(bokehW * dpr); bokehCv.height = Math.round(bokehH * dpr);
  bokehCv.style.width = bokehW + 'px'; bokehCv.style.height = bokehH + 'px';
  bg.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!bokehSpots.length) seedBokeh();
}
function seedBokeh(){
  bokehSpots = [];
  for (let i = 0; i < 26; i++) bokehSpots.push({
    x: Math.random() * bokehW, y: Math.random() * bokehH,
    r: 24 + Math.random() * 100,
    vx: (Math.random() - 0.5) * 0.25, vy: -0.05 - Math.random() * 0.22,
    a: 0.05 + Math.random() * 0.13,
    hue: Math.random() < 0.55 ? '127,180,217' : '255,179,92'
  });
}
function drawBokeh(){
  if (!bokehOn) return;
  bg.clearRect(0, 0, bokehW, bokehH);
  bg.globalCompositeOperation = 'lighter';
  for (const sp of bokehSpots){
    sp.x += sp.vx; sp.y += sp.vy;
    if (sp.y + sp.r < 0)       sp.y = bokehH + sp.r;
    if (sp.x < -sp.r)          sp.x = bokehW + sp.r;
    if (sp.x > bokehW + sp.r)  sp.x = -sp.r;
    const grd = bg.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sp.r);
    grd.addColorStop(0, 'rgba(' + sp.hue + ',' + sp.a + ')');
    grd.addColorStop(1, 'rgba(' + sp.hue + ',0)');
    bg.fillStyle = grd;
    bg.beginPath(); bg.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); bg.fill();
  }
  bg.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawBokeh);
}

document.getElementById('splash').addEventListener('click', () => {
  const s = document.getElementById('splash');
  s.style.opacity = '0'; s.style.pointerEvents = 'none';
  setTimeout(() => { s.style.display = 'none'; bokehOn = false; }, 1300);
  const scr = document.getElementById('intro-screen');
  scr.querySelector('.panel').innerHTML = introHTML(lang);
  scr.style.display = 'flex';
}, { once: true });
document.getElementById('intro-screen').addEventListener('click', e => {
  if (e.target.id !== 'intro-continue') return;
  document.getElementById('intro-screen').style.display = 'none';
  startVisualization();
});
function startVisualization(){
  document.body.classList.remove('pre-start');
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('readouts').style.display = 'block';
  document.getElementById('time-wrap').style.visibility = 'visible';
  sceneFrame.show(true);                            // the question stays for the whole scene
  setPlaying(true);
}

function applyLang(l){
  lang = l;
  localStorage.setItem('la-lang', l);
  document.documentElement.lang = l;
  document.title = T('doc_title');
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  document.getElementById('lang-it').classList.toggle('active', l === 'it');
  document.getElementById('splash-scene').innerHTML = T('splash_scene');
  document.getElementById('splash-click').innerHTML = T('splash_click');
  document.getElementById('scene-label').innerHTML  = T('scene_label');
  document.getElementById('hover-hint').innerHTML   = T('hover_hint');
  document.getElementById('lbl-month').innerHTML    = T('month_label');
  document.getElementById('lbl-speed').innerHTML    = T('speed');
  document.getElementById('lbl-view').innerHTML     = T('view');
  document.getElementById('lbl-window').innerHTML   = T('window');
  document.getElementById('lbl-models').innerHTML   = T('models');
  document.getElementById('lens-raw').innerHTML     = T('lens_raw');
  document.getElementById('lens-smoothed').innerHTML= T('lens_smooth');
  document.getElementById('lens-envelope').innerHTML= T('lens_env');
  document.getElementById('replay-toggle').innerHTML= T('replay');
  document.getElementById('reset-toggle').innerHTML = T('reset');
  document.getElementById('load-error').innerHTML   = T('load_error');
  document.getElementById('source').innerHTML = sourceHTML(l);
  if (dataLoaded){
    const y0 = ENS.time[0].slice(0, 4), y1 = ENS.time[N - 1].slice(0, 4);
    document.getElementById('describes').innerHTML = describesHTML(l, { n: N, y0, y1 });
    document.getElementById('reading-box').innerHTML =
      readingLines(l, { y0, y1 }).map(x => '<div class="read-line">' + x + '</div>').join('');
    document.getElementById('time-start').textContent = fmtMonth(ENS.time[0]);
    document.getElementById('time-end').textContent   = fmtMonth(ENS.time[N - 1]);
    readoutLens = null;
  }
  const introScr = document.getElementById('intro-screen');
  if (introScr.style.display === 'flex')
    introScr.querySelector('.panel').innerHTML = introHTML(l);
  // Persistent question + "?" help — both strings come from the shared modules,
  // so both are byte-identical to the static condition.
  sceneFrame.render(l, anchorQuestionHTML(l), helpContent(l));
  setPlaying(playing);
  refreshSoundBtn();
}
document.getElementById('lang-en').onclick = () => applyLang('en');
document.getElementById('lang-it').onclick = () => applyLang('it');

window.addEventListener('resize', () => {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeFit(); resizeBokeh();
});

/* ---------------------------------------------------------------- boot ---- */
async function boot(){
  applyLang(lang);
  window.dispatchEvent(new Event('resize'));
  seedBokeh(); drawBokeh();
  let B = null;
  try { B = await loadBundle(['../../data/amoc_translate_bundle.json', '/data/amoc_translate_bundle.json']); }
  catch (e){
    document.getElementById('load-error').style.display = 'block';
    console.error(e); return;
  }
  ENS = B.copernicus_ensemble;
  N = ENS.time.length;
  RAW = { cglo: ENS.members.cglo, glor: ENS.members.glor, oras: ENS.members.oras };
  LO = ENS.lower; HI = ENS.upper;
  // Rolling-mean re-views, identical treatment for all three members.
  SMOOTH = {};
  for (const win of [3, 12, 24]){
    SMOOTH[win] = { cglo: rollingMean(RAW.cglo, win), glor: rollingMean(RAW.glor, win), oras: rollingMean(RAW.oras, win) };
  }
  // THE driver: real (upper − lower) per month, min–max normalised.
  wNorm = new Float64Array(N);
  let wMax = -Infinity, wMin = Infinity;
  for (let i = 0; i < N; i++){
    wNorm[i] = HI[i] - LO[i];
    if (wNorm[i] > wMax) wMax = wNorm[i];
    if (wNorm[i] < wMin) wMin = wNorm[i];
  }
  for (let i = 0; i < N; i++) wNorm[i] = (wNorm[i] - wMin) / (wMax - wMin);
  // Sv axis range — IDENTICAL computation to the control file.
  let vMin = Infinity, vMax = -Infinity;
  for (const m of MEMBERS){
    const a = RAW[m.key];
    for (let i = 0; i < N; i++){ if (a[i] < vMin) vMin = a[i]; if (a[i] > vMax) vMax = a[i]; }
  }
  const pad = (vMax - vMin) * 0.05;
  yLo = vMin - pad; yHi = vMax + pad;
  document.querySelectorAll('#model-seg button').forEach(b => {
    b.style.borderBottomColor = MEMBERS.find(x => x.key === b.dataset.key).color;
  });
  timeEl.max = N - 1;
  computeFit();
  dataLoaded = true;
  applyLang(lang);
  requestAnimationFrame(draw);
}
boot();
</script>
