<!-- ==========================================================================
© 2026 Enrico Vaccari — All rights reserved.
MSc thesis research artefact ("Living Atlantic"), Tomorrow University (ToU).
============================================================================

DEMO FILE — NOT ADMINISTERED. Scene III ("The Threshold"), all three conditions
behind STATIC / DYNAMIC / EXPERIENTIAL buttons, same selector style and position
as thecolumn_tot.html and theengine_tot.html. The study files are:
  thethreshold-static.html        (C1 — control group)
  thethreshold-experiential.html  (C2+C3 — experimental group)

  C1 · STATIC       the paper idiom: three member series, faint envelope band,
                    grid, legend, axis labels. No motion, no annotation.
  C2 · DYNAMIC      the record travelled: playback 1993 → 2023, three strands
                    with distinct weights, ghost trails, amber current-moment
                    marker, aggregation lens, model toggles, speed / pause &
                    scrub / slider / replay / reset.
  C3 · EXPERIENTIAL adds the LIVING BAND (P4): the region spanned by the three
                    lines churns, widens and warms cool→amber with the real band
                    width (upper − lower) per month; hover readout; sound.

ENHANCED EXPERIENCE (BETA) — REPOSITORY DEMO ONLY, never administered, exposed
only inside C3 behind an explicit warning dialog. A research-communication
sandbox exploring further perceptual channels, ALL driven by the same real band
width; it introduces no new data and no derived statistic. See the ENH block in
the script for the per-feature ledger.

The disclosure rule of the study files applies here too: nothing on screen states
WHEN the three reanalyses agree or disagree, no era is marked or shaded, no band
width is ever printed, and no control auto-slows or flags any period.
=========================================================================== -->

const DEFAULT_LANG = 'en';
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang === 'en' || urlLang === 'it') ? urlLang
         : (localStorage.getItem('la-lang') === 'it' ? 'it' : DEFAULT_LANG);
function T(key, vars){
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function fmtMonth(ym){
  const [y, m] = ym.split('-');
  return T('months')[+m - 1] + ' ' + y;
}
const clean = (s) => s.replace(/&middot;/g, '·').replace(/&ndash;/g, '–')
  .replace(/&rsquo;/g, '’').replace(/&Egrave;/g, 'È').replace(/&Agrave;/g, 'À')
  .replace(/&Ugrave;/g, 'Ù').replace(/&Psi;/g, 'Ψ').replace(/&asymp;/g, '≈')
  .replace(/&#8310;/g, '⁶').replace(/&sup3;/g, '³').replace(/&egrave;/g, 'è')
  .replace(/&agrave;/g, 'à');

const hexRgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RAMP = [hexRgb(COL.deep), hexRgb(COL.north), hexRgb(COL.northHi)];
function rampColor(t){
  const seg = t <= 0.5 ? [RAMP[0], RAMP[1], t * 2] : [RAMP[1], RAMP[2], (t - 0.5) * 2];
  const c = seg[0].map((v, i) => Math.round(v + (seg[1][i] - v) * seg[2]));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const MEMBERS = [
  { key: 'cglo', name: 'C-GLORS', color: rampColor(0.55), phase: 0.0, width: 1.5, alpha: 0.90, wave: 'sine' },
  { key: 'glor', name: 'GLORYS',  color: rampColor(0.20), phase: 2.1, width: 1.15, alpha: 0.82, wave: 'triangle' },
  { key: 'oras', name: 'ORAS5',   color: rampColor(1.00), phase: 4.2, width: 1.35, alpha: 0.95, wave: 'sine' },
];
const COOL = hexRgb(COL.north), WARM = hexRgb(COL.beacon);
function tempColor(w, a){
  const c = COOL.map((v, i) => Math.round(v + (WARM[i] - v) * w));
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

/* ============================== state ==================================== */
let ENS = null, N = 0, dataLoaded = false;
let cond = 'C1';
let RAW = null, SMOOTH = null, LO = null, HI = null, wNorm = null;
let TRAJ = null, trajIdxOf = null;                 // Scene II latent (enhanced only)
let yLo = 0, yHi = 1, vMinAll = 0, vMaxAll = 1;
let W = 0, H = 0;
let tFloat = 0, scrubTarget = null;
let playing = true, speedMul = 1, frame = 0;
let beatEnv = 0, nextBeatT = 0;
let lens = 'raw', smoothWin = 12;
const memShown = { cglo: true, glor: true, oras: true };
let enhanced = false, enhSeen = false;
let periph = [];

const cv = document.getElementById('scene');
const g  = cv.getContext('2d');
const mouse = { x: -100, y: -100 };
const timeEl = document.getElementById('time');
const hoverEl = document.getElementById('hover');
const valuesEl = document.getElementById('values-line');

let fit = null;
function computeFit(){
  if (!ENS) return;
  const mL = 110, mR = 110, mT = 200, mB = 315;
  fit = { ox: mL, oy: mT, pw: Math.max(320, W - mL - mR), ph: Math.max(170, H - mT - mB) };
}
const X = (t) => fit.ox + (t / (N - 1)) * fit.pw;
const Y = (v) => fit.oy + ((yHi - v) / (yHi - yLo)) * fit.ph;

function rollingMean(arr, win){
  const out = new Float64Array(arr.length);
  const h = Math.floor(win / 2);
  for (let i = 0; i < arr.length; i++){
    let s = 0, n = 0;
    for (let k = i - h; k <= i + h; k++){
      const j = Math.max(0, Math.min(arr.length - 1, k));
      s += arr[j]; n++;
    }
    out[i] = s / n;
  }
  return out;
}
const activeSeries = (key) => (lens === 'smoothed') ? SMOOTH[smoothWin][key] : RAW[key];
function valAt(arr, t){
  const i0 = Math.floor(t), i1 = Math.min(i0 + 1, N - 1), f = t - i0;
  const e = f * f * (3 - 2 * f);
  return arr[i0] + (arr[i1] - arr[i0]) * e;
}
function bandAt(t){
  let lo = Infinity, hi = -Infinity;
  for (const m of MEMBERS){
    const v = valAt(activeSeries(m.key), t);
    if (v < lo) lo = v; if (v > hi) hi = v;
  }
  return [lo, hi];
}
/* THE ONE DRIVER — real (upper − lower) per month, normalised. */
function agitAt(t){
  const i0 = Math.floor(t), i1 = Math.min(i0 + 1, N - 1), f = t - i0;
  return wNorm[i0] * (1 - f) + wNorm[i1] * f;
}
/* ENH · Water Lens — a fluid pointer lens that locally magnifies the band's
   vertical extent around its own midpoint. Pure optics: adds no data. */
function lensGain(x){
  if (!enhanced || cond !== 'C3') return 1;
  if (mouse.x < fit.ox || mouse.x > fit.ox + fit.pw) return 1;
  const d = (x - mouse.x) / 110;
  return 1 + 0.55 * Math.exp(-d * d);
}

/* ------------------------------------------------------------ rendering --- */
function draw(){
  if (!dataLoaded) return;
  frame++;
  const isStatic = cond === 'C1', isExp = cond === 'C3';
  const enh = enhanced && isExp;

  // ENH · Breathing Medium — the whole water mass expands/contracts slightly
  // with the real band width. Applied to the ATMOSPHERE only; the data
  // geometry (axes, X/Y mapping) is untouched.
  const agitNow0 = agitAt(tFloat);
  const breath = enh ? 1 + 0.045 * (0.25 + agitNow0) * Math.sin(frame * 0.018) : 1;
  g.clearRect(0, 0, W, H);
  const bgr = g.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, Math.max(W, H) * 0.75 * breath);
  bgr.addColorStop(0, '#0a2136'); bgr.addColorStop(0.45, '#061524'); bgr.addColorStop(1, '#010811');
  g.fillStyle = bgr; g.fillRect(0, 0, W, H);

  // clock — uniform speed across time (never auto-slows anywhere)
  if (!isStatic){
    if (scrubTarget !== null){
      // ENH · Embodied Scrubbing — the cursor answers with a slight viscosity
      // proportional to the band width: subtle, continuous, no artificial lag.
      const visc = enh ? 0.32 / (1 + 1.7 * agitAt(scrubTarget)) : 1;
      tFloat += (scrubTarget - tFloat) * (enh ? visc : 1);
      if (Math.abs(scrubTarget - tFloat) < 0.02){ tFloat = scrubTarget; scrubTarget = null; }
    } else if (playing){
      tFloat += 0.06 * speedMul;
      if (tFloat > N - 1) tFloat = 0;
      timeEl.value = Math.round(tFloat);
    }
  }
  const upTo = isStatic ? N - 1 : tFloat;
  const visited = Math.floor(upTo);
  const agitNow = agitAt(upTo);

  drawFurniture(isStatic);

  // C1: faint envelope band behind the lines (paper idiom)
  if (isStatic){
    g.fillStyle = 'rgba(127,180,217,0.07)';
    g.beginPath();
    for (let i = 0; i < N; i++){ const x = X(i), y = Y(HI[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    for (let i = N - 1; i >= 0; i--) g.lineTo(X(i), Y(LO[i]));
    g.closePath(); g.fill();
  }

  const STEP = Math.max(1, Math.round(N / (fit.pw / 2.5)));

  // ============ C3 · ITEM 1 — THE LIVING BAND (+ ENH material optics) ======
  if (isExp && visited > 0){
    // ENH · Adaptive Optical Solidity + Material Encoding: extra scattering /
    // refraction passes whose count and blur ride on the real band width —
    // optical properties, not a linear opacity ramp.
    const passes = enh ? 3 : 1;
    for (let p = 0; p < passes; p++){
      for (let i = 0; i < visited; i += STEP){
        const j = Math.min(i + STEP, visited);
        const wA = wNorm[i], wB = wNorm[j], wq = (wA + wB) / 2;
        const [loA, hiA] = bandAt(i), [loB, hiB] = bandAt(j);
        const eA = wA * 3.2 * Math.sin(i * 0.55 + frame * (0.045 + wA * 0.09));
        const eB = wB * 3.2 * Math.sin(j * 0.55 + frame * (0.045 + wB * 0.09));
        const fA = wA * 3.2 * Math.cos(i * 0.47 + frame * (0.040 + wA * 0.08));
        const fB = wB * 3.2 * Math.cos(j * 0.47 + frame * (0.040 + wB * 0.08));
        // water lens: magnify the band about its midpoint (optics only)
        const gA = lensGain(X(i)), gB = lensGain(X(j));
        const mA = (loA + hiA) / 2, mB2 = (loB + hiB) / 2;
        const hiAl = mA + (hiA - mA) * gA, loAl = mA + (loA - mA) * gA;
        const hiBl = mB2 + (hiB - mB2) * gB, loBl = mB2 + (loB - mB2) * gB;
        // refraction offset grows with the width (enhanced passes only)
        const off = enh ? (p - 1) * (0.6 + 2.4 * wq) : 0;
        if (enh){ g.shadowColor = tempColor(wq, 0.5); g.shadowBlur = 4 + 18 * wq; }
        g.fillStyle = tempColor(wq, (0.10 + 0.20 * wq) / passes);
        g.beginPath();
        g.moveTo(X(i), Y(hiAl) + eA + off);
        g.lineTo(X(j), Y(hiBl) + eB + off);
        g.lineTo(X(j), Y(loBl) + fB + off);
        g.lineTo(X(i), Y(loAl) + fA + off);
        g.closePath(); g.fill();
      }
    }
    g.shadowBlur = 0;
    // internal churning filaments — bounded by the band, never loose dots
    for (let s = 0; s < 3; s++){
      g.beginPath();
      let started = false;
      for (let i = 0; i <= visited; i += STEP){
        const wq = wNorm[i];
        const [lo, hi] = bandAt(i);
        const mid = (lo + hi) / 2, half = (hi - lo) / 2 * lensGain(X(i));
        const u = Math.sin(i * (0.21 + s * 0.07) + frame * (0.05 + wq * 0.12) + s * 2.1);
        const yv = Y(mid + u * half * (0.30 + 0.60 * wq));
        if (!started){ g.moveTo(X(i), yv); started = true; } else g.lineTo(X(i), yv);
      }
      const wMid = wNorm[Math.max(0, Math.floor(visited / 2))];
      g.strokeStyle = tempColor(wMid, 0.06 + 0.16 * wMid);
      g.lineWidth = 1; g.stroke();
    }
  }

  // ================= ITEM 5 — GHOST TRAILS (+ ENH persistence) =============
  if (lens !== 'envelope'){
    for (const m of MEMBERS){
      const arr = activeSeries(m.key);
      const dim = (isStatic || memShown[m.key]) ? 1 : 0.14;
      g.lineWidth = m.width; g.lineJoin = 'round';
      if (isStatic){
        g.strokeStyle = m.color; g.globalAlpha = m.alpha * dim;
        g.beginPath();
        for (let i = 0; i < N; i += STEP) i ? g.lineTo(X(i), Y(arr[i])) : g.moveTo(X(i), Y(arr[i]));
        g.lineTo(X(N - 1), Y(arr[N - 1]));
        g.stroke();
      } else {
        for (let i = 0; i < visited; i += STEP){
          const j = Math.min(i + STEP, visited);
          const age = 1 - (i / Math.max(1, visited));
          // ENH · Ghost Persistence — compact regions leave steadier prints,
          // wider regions dissolve faster (exponent rides on the band width).
          const decay = enh ? (1.2 + 2.6 * wNorm[i]) : 1.6;
          const ghost = 0.22 + 0.78 * Math.pow(1 - age, decay);
          g.strokeStyle = m.color;
          g.globalAlpha = m.alpha * dim * ghost;
          g.beginPath(); g.moveTo(X(i), Y(arr[i])); g.lineTo(X(j), Y(arr[j])); g.stroke();
        }
        g.globalAlpha = m.alpha * dim;
        g.beginPath();
        g.moveTo(X(visited), Y(arr[visited]));
        g.lineTo(X(upTo), Y(valAt(arr, upTo)));
        g.stroke();
      }
    }
    g.globalAlpha = 1;
  }

  // ===================== CURRENT MOMENT — amber vocabulary =================
  if (!isStatic){
    const xNow = X(upTo);
    const [loNow, hiNow] = bandAt(upTo);
    g.strokeStyle = COL.beacon;
    g.globalAlpha = 0.22; g.lineWidth = 1;
    g.beginPath(); g.moveTo(xNow, fit.oy); g.lineTo(xNow, fit.oy + fit.ph); g.stroke();
    g.globalAlpha = 0.5 + beatEnv * 0.3; g.lineWidth = 2;
    g.beginPath(); g.moveTo(xNow, Y(hiNow) - 6); g.lineTo(xNow, Y(loNow) + 6); g.stroke();
    g.globalAlpha = 1;
    if (lens !== 'envelope'){
      for (const m of MEMBERS){
        const dim = memShown[m.key] ? 1 : 0.14;
        const hy = Y(valAt(activeSeries(m.key), upTo));
        const glow = g.createRadialGradient(xNow, hy, 0, xNow, hy, 9 + beatEnv * 5);
        glow.addColorStop(0, m.color.replace('rgb', 'rgba').replace(')', `,${0.55 * dim})`));
        glow.addColorStop(1, m.color.replace('rgb', 'rgba').replace(')', ',0)'));
        g.fillStyle = glow;
        g.beginPath(); g.arc(xNow, hy, 9 + beatEnv * 5, 0, Math.PI * 2); g.fill();
        g.globalAlpha = dim; g.fillStyle = m.color;
        g.beginPath(); g.arc(xNow, hy, 3.2, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
    }
    document.getElementById('beat-dot').style.transform = 'scale(' + (1 + beatEnv * 0.6).toFixed(2) + ')';
    updateReadout();
    updateHeartbeat();
  }

  if (enh){ drawLatentEcho(); drawPeripheral(agitNow); }
  if (isExp) updateHover(); else hoverEl.style.display = 'none';
  requestAnimationFrame(draw);
}

function drawFurniture(full){
  g.font = '9px ui-monospace,monospace';
  g.strokeStyle = full ? 'rgba(231,240,247,0.10)' : 'rgba(231,240,247,0.08)';
  g.fillStyle = 'rgba(231,240,247,0.35)';
  g.lineWidth = 1;
  for (let v = Math.ceil(yLo / 5) * 5; v <= yHi; v += 5){
    const y = Y(v);
    g.beginPath(); g.moveTo(fit.ox, y); g.lineTo(fit.ox + fit.pw, y); g.stroke();
    g.textAlign = 'right'; g.fillText(String(v), fit.ox - 10, y + 3);
  }
  const yrA = +ENS.time[0].slice(0, 4), yrB = +ENS.time[N - 1].slice(0, 4);
  g.textAlign = 'center';
  for (let yr = Math.ceil(yrA / 5) * 5; yr <= yrB; yr += 5){
    const idx = ENS.time.indexOf(yr + '-01');
    if (idx < 0) continue;
    const x = X(idx);
    g.beginPath(); g.moveTo(x, fit.oy); g.lineTo(x, fit.oy + fit.ph); g.stroke();
    g.fillText(String(yr), x, fit.oy + fit.ph + 20);
  }
  g.save();
  g.translate(fit.ox - 44, fit.oy + fit.ph / 2); g.rotate(-Math.PI / 2);
  g.fillText(clean(T('axis_y')), 0, 0);
  g.restore();
  g.textAlign = 'left';
  if (full){
    g.fillStyle = 'rgba(127,180,217,0.05)';
    g.fillRect(fit.ox, fit.oy, fit.pw, fit.ph);
    g.strokeStyle = 'rgba(231,240,247,0.35)';
    g.strokeRect(fit.ox, fit.oy, fit.pw, fit.ph);
    g.fillStyle = INK.inkSoft; g.font = '10px ui-monospace,monospace';
    const y0 = ENS.time[0].slice(0, 4), y1 = ENS.time[N - 1].slice(0, 4);
    g.fillText(clean(T('header_line', { y0, y1 })), fit.ox, fit.oy - 22);
    g.textAlign = 'center'; g.font = '9px ui-monospace,monospace';
    g.fillText(clean(T('caption_line')), fit.ox + fit.pw / 2, fit.oy + fit.ph + 48);
    g.fillText(clean(T('axis_x')), fit.ox + fit.pw / 2, fit.oy + fit.ph + 66);
    g.textAlign = 'left';
  }
}

/* ENH · Latent Echo — during scrub, a faint recall of where this same month
   sits in Scene II's latent plane (trajectory_monthly.pc1/pc2). Contextual
   memory only: no axes, no labels, no annotation, and it appears solely for
   months Scene II actually covers. Introduces no Scene III information. */
function drawLatentEcho(){
  if (!TRAJ || playing) return;
  const idx = Math.round(tFloat);
  const k = trajIdxOf[idx];
  if (k === undefined || k < 0) return;
  const cx = fit.ox + fit.pw - 70, cy = fit.oy + 54, R = 40;
  g.globalAlpha = 0.30;
  g.strokeStyle = 'rgba(231,240,247,0.25)'; g.lineWidth = 1;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  let p1min = Infinity, p1max = -Infinity, p2min = Infinity, p2max = -Infinity;
  for (let i = 0; i < TRAJ.pc1.length; i++){
    if (TRAJ.pc1[i] < p1min) p1min = TRAJ.pc1[i]; if (TRAJ.pc1[i] > p1max) p1max = TRAJ.pc1[i];
    if (TRAJ.pc2[i] < p2min) p2min = TRAJ.pc2[i]; if (TRAJ.pc2[i] > p2max) p2max = TRAJ.pc2[i];
  }
  g.fillStyle = 'rgba(127,180,217,0.5)';
  for (let i = 0; i < TRAJ.pc1.length; i += 4){
    const u = (TRAJ.pc1[i] - p1min) / (p1max - p1min) - 0.5;
    const v = (TRAJ.pc2[i] - p2min) / (p2max - p2min) - 0.5;
    g.beginPath(); g.arc(cx + u * R * 1.7, cy - v * R * 1.7, 0.7, 0, Math.PI * 2); g.fill();
  }
  const u = (TRAJ.pc1[k] - p1min) / (p1max - p1min) - 0.5;
  const v = (TRAJ.pc2[k] - p2min) / (p2max - p2min) - 0.5;
  g.globalAlpha = 0.85; g.fillStyle = COL.beacon;
  g.beginPath(); g.arc(cx + u * R * 1.7, cy - v * R * 1.7, 2.6, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
}

/* ENH · Peripheral Motion — faint drift at the screen margins, OUTSIDE the
   plotting region, whose speed and count rise with the current band width.
   Pre-attentive only; deliberately never inside the data area, so it can
   never be mistaken for a datum. */
function drawPeripheral(w){
  if (!periph.length){
    for (let i = 0; i < 60; i++) periph.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.4, s: 0.2 + Math.random() * 0.5 });
  }
  const inPlot = (x, y) => x > fit.ox - 20 && x < fit.ox + fit.pw + 20 && y > fit.oy - 20 && y < fit.oy + fit.ph + 20;
  const n = Math.round(18 + 42 * w);
  g.fillStyle = tempColor(w, 0.05 + 0.09 * w);
  for (let i = 0; i < Math.min(n, periph.length); i++){
    const p = periph[i];
    p.y -= p.s * (0.3 + 1.5 * w);
    if (p.y < -4){ p.y = H + 4; p.x = Math.random() * W; }
    if (inPlot(p.x, p.y)) continue;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
  }
}

let readoutIdx = -1, readoutLens = null;
function updateReadout(){
  const hi = isExpHoverIdx();
  const idx = hi >= 0 ? hi : Math.round(tFloat);
  const sig = lens + smoothWin;
  if (idx === readoutIdx && sig === readoutLens) return;
  readoutIdx = idx; readoutLens = sig;
  document.getElementById('month-big').textContent = fmtMonth(ENS.time[idx]);
  valuesEl.innerHTML = MEMBERS.map((m, k) =>
    `<span style="color:${m.color}">${activeSeries(m.key)[idx].toFixed(1)}</span>` +
    (k < 2 ? '<span class="vsep">·</span>' : '')
  ).join('') + `<span class="vunit">${T('unit')}</span>`;
}
function isExpHoverIdx(){
  if (cond !== 'C3' || !dataLoaded || document.body.classList.contains('pre-start')) return -1;
  const inX = mouse.x >= fit.ox && mouse.x <= fit.ox + fit.pw;
  const inY = mouse.y >= fit.oy - 20 && mouse.y <= fit.oy + fit.ph + 20;
  if (!inX || !inY) return -1;
  const ti = Math.round(((mouse.x - fit.ox) / fit.pw) * (N - 1));
  if (ti < 0 || ti > Math.floor(tFloat)) return -1;
  return ti;
}
function updateHover(){
  const ti = isExpHoverIdx();
  if (ti < 0){ hoverEl.style.display = 'none'; return; }
  const vals = MEMBERS.map(m => activeSeries(m.key)[ti].toFixed(1)).join(' · ');
  hoverEl.textContent = fmtMonth(ENS.time[ti]) + ' · ' + vals + ' Sv';
  hoverEl.style.display = 'block';
  hoverEl.style.left = Math.min(W - 320, mouse.x + 18) + 'px';
  hoverEl.style.top  = Math.max(12, mouse.y - 34) + 'px';
}

/* ------------------------------------------------------------- audio ------
   Base (study) sound: one voice whose texture roughens with the real band
   width. ENH · Triadic Sonification: each member becomes its OWN voice —
   three oscillators of the same family, each frequency following that
   member's value. Consonance/dissonance therefore EMERGES from the data;
   no agreement index is ever computed, stored or shown. */
let AC = null, osc = null, pulse = null, master = null;
let oceanGain = null, oceanLp = null, drone2 = null;
let triad = null, triadGain = null;
let audioOn = false;

function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.62;
  master.connect(AC.destination);
  osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 60;
  const osc2 = AC.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 120;
  const partial = AC.createGain(); partial.gain.value = 0.35;
  pulse = AC.createGain(); pulse.gain.value = 0;
  osc.connect(pulse); osc2.connect(partial); partial.connect(pulse); pulse.connect(master);
  osc.start(); osc2.start();
  const len = AC.sampleRate * 4;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5;
  }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  oceanLp = AC.createBiquadFilter(); oceanLp.type = 'lowpass'; oceanLp.frequency.value = 380; oceanLp.Q.value = 0.7;
  oceanGain = AC.createGain(); oceanGain.gain.value = 0.06;
  src.connect(oceanLp); oceanLp.connect(oceanGain); oceanGain.connect(master);
  const swell = AC.createOscillator(); swell.frequency.value = 0.06;
  const swellAmt = AC.createGain(); swellAmt.gain.value = 0.035;
  swell.connect(swellAmt); swellAmt.connect(oceanGain.gain);
  const drone1 = AC.createOscillator(); drone1.type = 'sine'; drone1.frequency.value = 82;
  drone2 = AC.createOscillator(); drone2.type = 'triangle'; drone2.frequency.value = 82.4;
  const droneGain = AC.createGain(); droneGain.gain.value = 0.014;
  drone1.connect(droneGain); drone2.connect(droneGain); droneGain.connect(master);
  src.start(); swell.start(); drone1.start(); drone2.start();
  // three independent member voices (silent until ENHANCED is enabled)
  triadGain = AC.createGain(); triadGain.gain.value = 0; triadGain.connect(master);
  triad = MEMBERS.map(m => {
    const o = AC.createOscillator(); o.type = m.wave; o.frequency.value = 220;
    const gn = AC.createGain(); gn.gain.value = 0.055;
    o.connect(gn); gn.connect(triadGain); o.start();
    return { osc: o, gain: gn, key: m.key };
  });
}
function updateHeartbeat(){
  beatEnv *= 0.93;
  const norm = agitAt(tFloat);
  const bpm = 40 + norm * 40;
  const nowS = performance.now() / 1000;
  // Triadic voices track continuously (not only on the beat)
  if (audioOn && AC && AC.state === 'running' && triad){
    const now = AC.currentTime;
    const wantTriad = (enhanced && cond === 'C3') ? 0.5 : 0;
    triadGain.gain.setTargetAtTime(wantTriad, now, 0.25);
    if (wantTriad > 0){
      for (const v of triad){
        const val = valAt(activeSeries(v.key), tFloat);
        const nrm = (val - vMinAll) / (vMaxAll - vMinAll);      // each member's OWN value
        v.osc.frequency.setTargetAtTime(150 + nrm * 210, now, 0.08);
      }
    }
  }
  if (nowS < nextBeatT) return;
  nextBeatT = nowS + 60 / bpm;
  beatEnv = 1;
  if (audioOn && AC && AC.state === 'running'){
    const now = AC.currentTime;
    pulse.gain.cancelScheduledValues(now);
    pulse.gain.setTargetAtTime(0.4 + norm * 0.9, now, 0.015);
    pulse.gain.setTargetAtTime(0, now + 0.09, 0.12);
    osc.frequency.setTargetAtTime(55 + norm * 20, now, 0.05);
    if (oceanGain){
      oceanGain.gain.setTargetAtTime(0.05 + 0.11 * norm, now, 0.08);
      oceanLp.frequency.setTargetAtTime(320 + norm * 900, now, 0.10);
    }
    if (drone2) drone2.frequency.setTargetAtTime(82.4 + norm * 5.6, now, 0.10);
  }
}

const bokehCv = document.getElementById('bokeh');
const bg = bokehCv.getContext('2d');
let bokehSpots = [], bokehOn = true, bokehW = 0, bokehH = 0;
function resizeBokeh(){
  const dpr = window.devicePixelRatio || 1;
  bokehW = innerWidth; bokehH = innerHeight;
  bokehCv.width = Math.round(bokehW * dpr); bokehCv.height = Math.round(bokehH * dpr);
  bokehCv.style.width = bokehW + 'px'; bokehCv.style.height = bokehH + 'px';
  bg.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!bokehSpots.length) seedBokeh();
}
function seedBokeh(){
  bokehSpots = [];
  for (let i = 0; i < 26; i++) bokehSpots.push({
    x: Math.random() * bokehW, y: Math.random() * bokehH,
    r: 24 + Math.random() * 100,
    vx: (Math.random() - 0.5) * 0.25, vy: -0.05 - Math.random() * 0.22,
    a: 0.05 + Math.random() * 0.13,
    hue: Math.random() < 0.55 ? '127,180,217' : '255,179,92'
  });
}
function drawBokeh(){
  if (!bokehOn) return;
  bg.clearRect(0, 0, bokehW, bokehH);
  bg.globalCompositeOperation = 'lighter';
  for (const sp of bokehSpots){
    sp.x += sp.vx; sp.y += sp.vy;
    if (sp.y + sp.r < 0) sp.y = bokehH + sp.r;
    if (sp.x < -sp.r) sp.x = bokehW + sp.r;
    if (sp.x > bokehW + sp.r) sp.x = -sp.r;
    const grd = bg.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, sp.r);
    grd.addColorStop(0, 'rgba(' + sp.hue + ',' + sp.a + ')');
    grd.addColorStop(1, 'rgba(' + sp.hue + ',0)');
    bg.fillStyle = grd;
    bg.beginPath(); bg.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); bg.fill();
  }
  bg.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawBokeh);
}

/* ---------------------------------------------------------------- boot ---- */
async function boot(){
  applyLang(lang);
  window.dispatchEvent(new Event('resize'));
  seedBokeh(); drawBokeh();
  let B = null;
  try { B = await loadBundle('/data/amoc_translate_bundle.json'); }
  catch (e){
    document.getElementById('load-error').style.display = 'block';
    console.error(e); return;
  }
  ENS = B.copernicus_ensemble;
  N = ENS.time.length;
  RAW = { cglo: ENS.members.cglo, glor: ENS.members.glor, oras: ENS.members.oras };
  LO = ENS.lower; HI = ENS.upper;
  SMOOTH = {};
  for (const win of [3, 12, 24]){
    SMOOTH[win] = { cglo: rollingMean(RAW.cglo, win), glor: rollingMean(RAW.glor, win), oras: rollingMean(RAW.oras, win) };
  }
  wNorm = new Float64Array(N);
  let wMax = -Infinity, wMin = Infinity;
  for (let i = 0; i < N; i++){
    wNorm[i] = HI[i] - LO[i];
    if (wNorm[i] > wMax) wMax = wNorm[i];
    if (wNorm[i] < wMin) wMin = wNorm[i];
  }
  for (let i = 0; i < N; i++) wNorm[i] = (wNorm[i] - wMin) / (wMax - wMin);
  let vMin = Infinity, vMax = -Infinity;
  for (const m of MEMBERS){
    const a = RAW[m.key];
    for (let i = 0; i < N; i++){ if (a[i] < vMin) vMin = a[i]; if (a[i] > vMax) vMax = a[i]; }
  }
  vMinAll = vMin; vMaxAll = vMax;
  const pad = (vMax - vMin) * 0.05;
  yLo = vMin - pad; yHi = vMax + pad;
  // Scene II latent, for the ENHANCED Latent Echo only (months that scene covers)
  if (B.trajectory_monthly){
    TRAJ = B.trajectory_monthly;
    trajIdxOf = new Int32Array(N).fill(-1);
    for (let i = 0; i < N; i++) trajIdxOf[i] = TRAJ.time.indexOf(ENS.time[i]);
  }
  document.getElementById('sw-cglo').style.background = MEMBERS[0].color;
  document.getElementById('sw-glor').style.background = MEMBERS[1].color;
  document.getElementById('sw-oras').style.background = MEMBERS[2].color;
  document.querySelectorAll('#model-seg button').forEach(b => {
    b.style.borderBottomColor = MEMBERS.find(x => x.key === b.dataset.key).color;
  });
  timeEl.max = N - 1;
  computeFit();
  dataLoaded = true;
  applyLang(lang);
  requestAnimationFrame(draw);
}
boot();
